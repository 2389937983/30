<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>字卡传讯 · 聊天 + 字卡库</title>
<style>
/* ============================================================
   客单30 · 字卡传讯
   本片 = 客单30 自己的皮肤与版式（源自《主屏版式稿-字卡传讯2.html》，逐条保留，
   只把「版式稿」的静态占位换成活的控件与容器）。
   业务代码（聊天底盘 / 字卡库 / 状态树 / 调度）在 _src/lib/ 里逐字节冻结，
   不需要也不允许认识本文件里的任何 class 之外的约定。
   ------------------------------------------------------------
   分区：
     A. 主屏版式（原版式稿，未改设计）
     B. 应用屏骨架（会话 / 字卡库 / 设置 / 占位）—— 冻结片 DOM 的样式在这里
     C. 弹层 / toast
     D. 皮肤二：黑白灰（body.mono）与 Baby pink（body:not(.mono)）的覆盖
   ============================================================ */

/* ===================== A. 主屏版式（原版式稿） ===================== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pad-x:12px; --gap:18px; --row-h:78px;
  --radius:26px; --blur:16px;
  --ink:#6f5c61; --ink-2:#9c8a8f; --ink-3:#b6a6aa; --rose:#b9858e;
  --line:rgba(255,255,255,.82);
  --hand:"Segoe Script","Bradley Hand","Snell Roundhand","STKaiti","KaiTi",cursive;
  --serif:Georgia,"Times New Roman",serif;
}
body{height:100vh;height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center;
  /* ⚠️ 2026-10-17 修（用户反馈「部署到网址后左右两边有灰边、背景填不满」）：
     这里原来是中性灰 #f4f4f4。机型框等比放大后（03_shell.js 的 fit）短边铺满，
     另一条边仍会剩几像素 —— 灰底会把那道缝显出来（就是截图里那两条灰边）。
     换成与框内 .wall 同族的主题底：剩下的几像素与框内背景同色，看不出接缝。
     黑白皮肤下跟着去色（见 D 区 body.mono 覆盖）。 */
  background:linear-gradient(168deg,#f1eaec 0%,#e8e0e4 46%,#ded6db 100%);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#3d3d3d;-webkit-font-smoothing:antialiased}
.stage{width:390px;height:844px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  transform-origin:center center}
.phone{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;
  box-shadow:0 28px 64px rgba(122,100,110,.3),0 0 0 1px rgba(255,255,255,.7)}

/* 背景：雾感底 + 织物纹 + 错位梅花波点 + 上下蕾丝 */
.wall{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(115% 60% at 78% 3%,#fdf8f6 0%,rgba(253,248,246,0) 62%),
    radial-gradient(95% 52% at 10% 24%,#ece2e6 0%,rgba(236,226,230,0) 64%),
    radial-gradient(120% 58% at 60% 86%,#e7dde2 0%,rgba(231,221,226,0) 66%),
    linear-gradient(168deg,#f1eaec 0%,#e8e0e4 46%,#ded6db 100%)}
.weave{position:absolute;inset:0;opacity:.5;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.42) 0 1px,transparent 1px 5px),
    repeating-linear-gradient(-45deg,rgba(186,168,176,.16) 0 1px,transparent 1px 6px)}
.dots{position:absolute;inset:0;opacity:.6;
  background-image:radial-gradient(circle at 4px 7px,rgba(255,255,255,.95) 1.3px,transparent 1.6px),
    radial-gradient(circle at 12px 21px,rgba(255,255,255,.95) 1.3px,transparent 1.6px);
  background-size:16px 28px;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.22));mask-image:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.22))}
.lace{position:absolute;left:0;right:0;height:18px;opacity:.6;background-repeat:repeat-x;background-size:17px 18px}
.lace.top{top:0;background-image:radial-gradient(circle at 50% 0%,rgba(255,255,255,.95) 7px,rgba(255,255,255,0) 7.8px)}
.lace.bottom{bottom:0;background-image:radial-gradient(circle at 50% 100%,rgba(255,255,255,.9) 7px,rgba(255,255,255,0) 7.8px)}
.deco{position:absolute;inset:0;pointer-events:none;z-index:4}
.deco i{position:absolute;display:block;font-style:normal;font-size:11px;color:#e2bfc8;
  text-shadow:0 0 7px rgba(255,255,255,.95)}

.screen{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column}

.board{flex:0 0 auto;margin:18px var(--pad-x) 0;display:grid;grid-template-columns:repeat(4,1fr);
  grid-auto-rows:var(--row-h);gap:var(--gap)}
/* 毛玻璃基类 */
.g{position:relative;overflow:hidden;border-radius:var(--radius);
  background:linear-gradient(152deg,rgba(255,255,255,.6),rgba(255,255,255,.24) 58%,rgba(255,255,255,.4));
  border:1px solid var(--line);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(122%);backdrop-filter:blur(var(--blur)) saturate(122%);
  box-shadow:0 10px 26px rgba(122,100,110,.16),0 2px 6px rgba(122,100,110,.07),
    inset 0 1px 0 rgba(255,255,255,.98),inset 0 0 30px rgba(255,255,255,.55)}
.g::after{content:"";position:absolute;inset:3px;pointer-events:none;border-radius:calc(var(--radius) - 4px);
  border:1px solid rgba(255,255,255,.5)}
.span2{grid-column:span 2;grid-row:span 2}
.span4r3{grid-column:span 4;grid-row:span 3}
.row1{grid-row:span 1}

/* ============================================================
   双人纪念日大卡（顶替原时钟区 + 今日字卡位）—— 格式照抄 23 的 .w-anniv：
   上半银灰渐变照片区、下半白卡、两个头像骑在交界线上
   ------------------------------------------------------------
   ⚠️ 本单只接「聊天 + 字卡库」；纪念日未迁移 ⇒ 这张卡是**版式稿的静态展示内容**，
   点它给明确占位（见 03_shell.js 的 data-app="anniv"），不假装它有数据。
   ============================================================ */
.w-pair{cursor:pointer}
.w-pair .bg{position:absolute;left:0;right:0;top:0;height:46%;
  background-size:cover;background-position:center;
  background-image:
    radial-gradient(55% 70% at 18% 18%,rgba(255,255,255,.95),transparent 62%),
    radial-gradient(45% 55% at 82% 26%,rgba(238,222,226,.95),transparent 68%),
    radial-gradient(60% 55% at 62% 96%,rgba(176,158,168,.9),transparent 74%),
    linear-gradient(158deg,#e4dadd 0%,#cdc0c8 62%,#b9a9b3 100%)}
.w-pair .sheet{position:absolute;left:0;right:0;top:42%;bottom:0;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.97));
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-radius:var(--radius) var(--radius) 0 0;text-align:center;padding:52px 16px 12px}
.w-pair .avaRow{position:absolute;left:0;right:0;top:42%;transform:translateY(-50%);z-index:2;
  display:flex;align-items:center;justify-content:center;gap:6px}
.w-pair .ava{width:62px;height:62px;border-radius:50%;overflow:hidden;flex:0 0 auto;
  background:#fff;border:3px solid #fff;box-shadow:0 5px 16px rgba(120,96,106,.26);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:19px;color:#8a7a80}
.w-pair .ava img{width:100%;height:100%;object-fit:cover}
.w-pair .hrt{font-size:15px;color:#c98d95;line-height:1;flex:0 0 auto;
  text-shadow:0 1px 4px rgba(255,255,255,.9)}
.w-pair .nm{font-size:14.5px;color:#5f4f54;letter-spacing:1px}
.w-pair .days{font-family:var(--serif);font-size:27px;font-weight:600;color:#a9767f;letter-spacing:.5px;margin-top:1px}
.w-pair .days span{font-size:11.5px;font-weight:400;color:var(--ink-3);letter-spacing:2px;margin-left:4px}
.w-pair .en{margin-top:5px;font-family:var(--hand);font-size:12.5px;color:rgba(146,120,128,.75)}
.w-pair .meta{position:absolute;left:0;right:0;bottom:10px;display:flex;align-items:center;justify-content:center;gap:3px;
  font-size:9.5px;color:var(--ink-2)}

/* ---------- 第13单 · 纪念日 ---------- */
/* ① 主屏大卡的两区交互（用户口径：点白区/双人头像 = 进纪念日；点灰区 = 换背景图）。
      .avaRow 是跨在分界线上的绝对定位装饰层（top:42% translateY(-50%)），本身不可点 ——
      否则它那条横带会把灰区的点击整条吃掉；点击会穿到它下面那一区。 */
.w-pair .avaRow{pointer-events:none}
.w-pair .ava{pointer-events:auto;cursor:pointer}
.w-pair .bg{cursor:pointer}
.w-pair .sheet{cursor:pointer}
/* 换过背景图之后：压一层极淡的暗角，让压在分界线上的两颗头像仍然立得住 */
.w-pair .bg.has-img::after{content:'';position:absolute;left:0;right:0;bottom:0;height:36%;
  background:linear-gradient(180deg,transparent,rgba(58,44,50,.18))}

/* ② 片 14_anniv.js 自己渲染的类名（片是从客单23 版式稿抽出来的，类名以 ann- 开头）：
      .card / .li / .btn / .inp / .field / .chips / .empty / .sechd 这些底盘类本单外壳已有，
      这里只补 ann- 前缀的那几个，风格沿用同一套变量（两套皮肤都跟着走）。 */
.ann-search{position:relative;display:flex;align-items:center;margin:2px 0 10px}
.ann-search__i{position:absolute;left:11px;top:50%;transform:translateY(-50%);display:flex;
  color:var(--ink-3);pointer-events:none}
.ann-search .inp{padding-left:33px}
.ann-today{background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(252,244,246,.96));
  border:1px solid rgba(185,133,142,.22)}
.ann-today__t{font-family:var(--serif);font-size:16px;color:#a9767f;letter-spacing:.5px}
.ann-today__s{margin-top:3px;font-size:10.5px;color:var(--ink-3)}
.ann-row{gap:8px}
.ann-row.is-today{background:linear-gradient(90deg,rgba(185,133,142,.10),transparent)}
.ann-ic{width:30px;height:30px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:rgba(185,133,142,.14);color:var(--rose)}
.ann-ic svg{width:16px;height:16px}
.ann-days{font-size:11.5px;color:var(--ink-2);white-space:nowrap;flex:0 0 auto}
.ann-days.on{color:var(--rose);font-weight:600}
/* ③ 纪念日页顶部的「主屏显示哪一条」联动条（接入层补画，见 adapter §13.3） */
.ann-show{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ann-show__i{width:26px;height:26px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:rgba(185,133,142,.14);color:var(--rose)}
.ann-show__i svg{width:15px;height:15px}
body.mono .ann-today{background:linear-gradient(160deg,#fff,#f4f4f4);border-color:rgba(0,0,0,.07)}
body.mono .ann-today__t{color:#5a5a5a}
body.mono .ann-row.is-today{background:linear-gradient(90deg,rgba(0,0,0,.045),transparent)}
body.mono .ann-ic,body.mono .ann-show__i{background:rgba(0,0,0,.05);color:#6e6e6e}
body.mono .ann-days.on{color:#4a4a4a}

/* ---------- 拍立得白卡纸（照抄 23） ---------- */
.g.w-photo{padding:10px 10px 32px;background:#fff;background-image:none;
  border:1px solid rgba(42,39,35,.06);
  -webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:0 6px 18px rgba(122,100,110,.16),0 1px 3px rgba(122,100,110,.08)}
.w-photo .slots{position:relative;width:100%;height:100%;display:flex;gap:9px}
.w-photo .slot{position:relative;flex:1 1 0;min-width:0;border-radius:8px;cursor:pointer;
  background-size:cover;background-position:center;box-shadow:0 1px 4px rgba(70,60,66,.2);
  transition:transform .25s,box-shadow .25s}
.w-photo .slot:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(122,100,110,.26)}
.w-photo .cap{position:absolute;left:0;right:0;bottom:10px;text-align:center;pointer-events:none;
  font-family:var(--hand);font-size:12.5px;color:#2f2c29}
/* 照片位占位渐变（不内嵌位图，运行时上传走 objectURL） */
.ph2{background-image:radial-gradient(70% 70% at 70% 30%,#f6f1ec,#ded2d6 62%,#c3b3b9)}
.ph3{background-image:radial-gradient(70% 70% at 40% 40%,#fdf3f0,#e8d8d6 60%,#c9b5b8)}

/* ---------- 功能卡 ---------- */
.w-fn{display:flex;flex-direction:column;padding:12px 14px}
.w-fn .hd{display:flex;align-items:center;gap:7px}
.w-fn .av{width:34px;height:34px;border-radius:12px;flex:0 0 auto;overflow:hidden;
  background:linear-gradient(150deg,#f3dfe3,#e2c6cf);display:flex;align-items:center;justify-content:center;color:#fff}
.w-fn .tt{font-size:12px;color:var(--ink);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-fn .tm{font-family:var(--serif);font-size:9.5px;color:var(--ink-3);flex:0 0 auto}
.w-fn .pv{margin-top:8px;font-size:11px;line-height:1.65;color:var(--ink-2);flex:1 1 auto;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w-fn .go{margin-top:auto;font-size:10px;color:var(--rose)}
.bdg{position:absolute;top:11px;right:12px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--rose);color:#fff;font-size:10px;line-height:17px;text-align:center;font-weight:600}
.bdg.off{display:none}

/* ---------- 字卡库入口（2×2） ---------- */
.w-lib{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.w-lib .ic{width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#f3dfe3,#dfbcc8);color:#fff}
.w-lib .n{font-family:var(--serif);font-size:22px;line-height:1;color:var(--ink)}
.w-lib .u{font-size:10px;color:var(--ink-2)}
.w-lib .btn{font-size:10.5px;color:#fff;background:var(--rose);border-radius:20px;padding:5px 13px;margin-top:2px}

/* ---------- 底部应用图标 ---------- */
.apps{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.app{display:flex;flex-direction:column;align-items:center;gap:4px}
.app .ic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink)}
.app .lb{font-size:10px;color:var(--ink-2)}

/* ---------- 一整张微倾的拍立得（可点：换相片位那张图，2026-10-17 用户要求） ---------- */
.polaroid-cell{position:relative}
.polaroid{position:absolute;inset:3px 2px 1px 2px;display:flex;flex-direction:column;
  background:#fff;border-radius:6px;padding:9px 9px 30px;transform:rotate(-2.5deg);
  box-shadow:0 8px 20px rgba(122,100,110,.20),0 1px 3px rgba(122,100,110,.10);
  cursor:pointer}
.polaroid .ph{flex:1 1 auto;min-height:0;border-radius:3px;box-shadow:0 1px 4px rgba(70,60,66,.16);position:relative}
/* 相片位有用户自己的图时：铺满不拉伸；⚠️ `filter:none` 是必须的 ——
   黑白皮肤那条 `body.mono .ph2{filter:grayscale(1)}` 是给**默认渐变占位**去色用的，
   用户自己传的照片在黑白皮肤下也该保持原色（与壁纸/头像同口径）。 */
.polaroid .ph.has-img{background-size:cover;background-position:center;background-repeat:no-repeat;filter:none}
.polaroid .cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;pointer-events:none;
  font-family:var(--hand);font-size:12px;color:#2f2c29}
/* ---------- 皮肤切换按钮 ---------- */
.skin-switch{position:absolute;right:14px;top:16px;z-index:6;display:flex;gap:4px;padding:3px;
  border-radius:20px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.skin-switch button{border:0;background:none;font-family:inherit;font-size:10px;color:var(--ink-2);
  padding:4px 10px;border-radius:16px;cursor:pointer}
.skin-switch button.on{background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 1px 4px rgba(122,100,110,.14)}
/* 进了应用屏就把皮肤开关收起来（它压在会话头上会挡住返回键） */
body.app-on .skin-switch{display:none}

/* 下半屏独立布局：不覆盖顶部纪念日的尺寸及样式。 */
.memory-layout{grid-column:1 / -1;grid-row:span 3;display:grid;
  grid-template-columns:224px minmax(0,1fr);grid-template-rows:126px 126px;
  grid-template-areas:"photo chat" "photo mail";gap:14px}
.memory-layout .polaroid-cell{grid-area:photo;min-width:0}
.memory-layout .polaroid{inset:3px 2px 1px 3px;padding:10px 10px 37px;
  transform:rotate(-1.8deg);border-radius:5px}
.memory-layout .polaroid .cap{bottom:11px;font-size:14px}
.memory-layout .w-fn{min-width:0;padding:13px 12px 11px;border-radius:19px;
  box-shadow:0 5px 15px rgba(122,100,110,.08);background:rgba(255,255,255,.68)}
.memory-layout .w-fn::after,.draw-strip::after{display:none}
.message-chat{grid-area:chat}.message-mail{grid-area:mail}
.memory-layout .hd{gap:6px;padding-right:15px}
.memory-layout .av{width:23px;height:23px;border-radius:8px}
.memory-layout .av svg{width:14px;height:14px}
.memory-layout .tt{font-size:12px}
.memory-layout .pv{font-size:11px;line-height:1.7;margin-top:9px;-webkit-line-clamp:2}
.memory-layout .go{font-size:9px;letter-spacing:.4px;opacity:.8}
.memory-layout .bdg{top:15px;right:10px;min-width:15px;height:15px;line-height:15px;font-size:9px;padding:0 3px}
.board .draw-strip{grid-column:1 / -1;flex-direction:row;justify-content:flex-start;
  padding:0 17px;gap:12px;text-align:left;border-radius:21px;
  background:rgba(255,255,255,.65);box-shadow:0 5px 15px rgba(122,100,110,.07)}
.draw-strip .ic{width:39px;height:43px;border-radius:12px;flex-shrink:0}
.lib-copy{flex:1;min-width:0}
.lib-title{font-size:13px;letter-spacing:1px;color:var(--ink);margin-bottom:6px}
.draw-strip .u{font-size:10px}.draw-strip .n{font-size:12px;font-family:inherit}
.draw-strip .btn{margin:0;padding:9px 14px;font-size:11px;white-space:nowrap}
.board .apps{padding:0 12px}
body.mono .memory-layout .w-fn,body.mono .board .draw-strip{
  box-shadow:0 5px 15px rgba(70,70,70,.045);border-color:rgba(0,0,0,.025)}

/* ============================================================
   B. 应用屏骨架（会话 / 字卡库 / 设置 / 占位）
   ------------------------------------------------------------
   本段的类名**全部来自冻结片真实产出的 DOM**（25_chat.js 的 chatScreenHTML/msgHTML、
   30_cardlib.js 的 paintCards、10_core.js 的 openSheet/toast）。
   改这里之前先回去读那三处的产出，别凭猜。
   ⚠️ 会话屏的钉底约定（29 的实测教训）：
     #appInner 纵向 flex + 消息区 flex:1;min-height:0;overflow-y:auto + 输入条 flex:none。
     用 position:sticky 做输入条，在**聊天记录短**的时候会飘到屏幕中间。
   ============================================================ */
.app-view{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;overflow:hidden}
.app-view.on{display:flex}
.app-view::before{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(115% 60% at 78% 3%,#fdf8f6 0%,rgba(253,248,246,0) 62%),
    radial-gradient(95% 52% at 10% 24%,#ece2e6 0%,rgba(236,226,230,0) 64%),
    radial-gradient(120% 58% at 60% 86%,#e7dde2 0%,rgba(231,221,226,0) 66%),
    linear-gradient(168deg,#f1eaec 0%,#e8e0e4 46%,#ded6db 100%)}
#appInner{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* 屏头 */
.ahead{flex:none;display:flex;align-items:center;gap:8px;padding:14px 12px 8px}
.abtn{width:38px;height:38px;border-radius:14px;flex:none;border:1px solid var(--line);
  background:rgba(255,255,255,.72);color:var(--ink);display:flex;align-items:center;justify-content:center;
  font:inherit;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.abtn svg{width:18px;height:18px}
.ahead-t{flex:1;min-width:0;text-align:center}
.ahead-t h2{font-size:15px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ahead-t p{font-size:10.5px;color:var(--ink-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 顶栏右侧的配平占位块：宽度与 .abtn 一致（38px），本身不可见、不可点、不参与动作表。
   用途 = 给「右侧没有按钮」的屏（soon 占位屏 / 设置页）补对称，标题才不会偏右 20.4px。 */
.abtn-ghost{width:38px;height:38px;flex:none}

/* 会话：消息区 */
.thread{flex:1;min-height:0;overflow-y:auto;padding:4px 12px 10px;-webkit-overflow-scrolling:touch}
.mrow{display:flex;gap:8px;margin-bottom:11px;align-items:flex-end}
.mrow.me{flex-direction:row-reverse}
.mav{width:30px;height:30px;border-radius:10px;flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#f8dbe5,#edb7cb);color:#fff;font-size:12px;cursor:pointer;
  box-shadow:0 3px 9px rgba(181,115,137,.18)}
.mav svg{width:16px;height:16px}
.mav img{width:100%;height:100%;object-fit:cover}
.mcol{max-width:76%;min-width:0;display:flex;flex-direction:column;gap:3px}
.mrow.me .mcol{align-items:flex-end}
.bubble{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:16px;
  padding:9px 12px;font-size:13px;line-height:1.62;color:#4f4247;word-break:break-word;white-space:pre-wrap;
  box-shadow:0 4px 12px rgba(122,100,110,.10)}
.bubble.card{background:linear-gradient(152deg,#fff,#fdf1f5);border-color:rgba(219,167,183,.5)}
.mrow.me .bubble{background:linear-gradient(150deg,#f7d2de,#eeb4c8);color:#5c3a45;
  border-color:rgba(255,255,255,.72)}
.meta{font-size:9.5px;color:var(--ink-3);padding:0 3px}
.mrow.sys{justify-content:center}
.mrow.sys .mcol{max-width:88%}
.sbar{font-size:10px;color:var(--ink-2);background:rgba(255,255,255,.62);border-radius:12px;
  padding:4px 11px;text-align:center;line-height:1.6}
.typing{display:flex;gap:4px;align-items:center;padding:11px 13px;border-radius:16px;
  background:rgba(255,255,255,.9);border:1px solid var(--line)}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* 会话：输入条（钉底） */
.composer{flex:none;display:flex;align-items:flex-end;gap:7px;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));
  border-top:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.5);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#chatInput{flex:1;min-width:0;min-height:38px;max-height:96px;resize:none;font:inherit;font-size:13px;
  line-height:1.45;color:var(--ink);border:1px solid var(--line);border-radius:14px;
  background:rgba(255,255,255,.9);padding:9px 12px}
#chatInput::placeholder{color:var(--ink-3)}
.cbtn{width:38px;height:38px;border-radius:14px;flex:none;border:1px solid var(--line);
  background:rgba(255,255,255,.85);color:var(--ink-2);display:flex;align-items:center;justify-content:center;
  font:inherit;cursor:pointer}
.cbtn svg{width:19px;height:19px}
.cbtn.send{background:var(--rose);color:#fff;border-color:transparent}
.cpanel{flex:none;max-height:0;overflow:hidden;padding:0 12px;transition:max-height .2s ease}
.cpanel.on{max-height:210px;overflow-y:auto;padding:10px 12px 4px}
.cpanel-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cpanel button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px;
  border:1px solid var(--line);background:rgba(255,255,255,.78);border-radius:14px;
  font:inherit;font-size:10px;color:var(--ink-2);cursor:pointer}
.cpanel button svg{width:19px;height:19px;color:var(--ink)}

/* 字卡库 / 设置 / 占位：滚动区 */
.abody{flex:1;min-height:0;overflow-y:auto;padding:2px 12px calc(18px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.chips button{border:1px solid var(--line);background:rgba(255,255,255,.72);color:var(--ink-2);
  font:inherit;font-size:11px;padding:5px 11px;border-radius:14px;cursor:pointer}
.chips button.on{background:var(--rose);color:#fff;border-color:transparent}
.field{display:block;margin-bottom:10px}
.field i{display:block;font-style:normal;font-size:11px;color:var(--ink-2);margin-bottom:5px}
.inp,.sel{width:100%;font:inherit;font-size:12.5px;color:var(--ink);border:1px solid var(--line);
  border-radius:13px;background:rgba(255,255,255,.88);padding:9px 12px}
.card{background:rgba(255,255,255,.74);border:1px solid var(--line);border-radius:16px;
  padding:10px 12px;margin-bottom:10px;box-shadow:0 5px 15px rgba(122,100,110,.07)}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.7)}
.li:last-child{border-bottom:0}
.li-t{flex:1;min-width:0;font-size:12.5px;line-height:1.55;color:var(--ink);word-break:break-word}
.li-s{display:block;font-size:10.5px;color:var(--ink-2);line-height:1.5}
.sechd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:12px 0 6px}
.sechd h3{font-size:12.5px;font-weight:600;color:var(--ink)}
.sechd span{font-size:10px;color:var(--ink-3)}
.btn-row{display:flex;flex-wrap:wrap;gap:7px}
.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
  background:rgba(255,255,255,.82);color:var(--ink);font:inherit;font-size:11.5px;
  padding:8px 12px;border-radius:13px;cursor:pointer}
.btn svg{width:14px;height:14px}
.btn.dark{background:var(--rose);color:#fff;border-color:transparent}
.btn.danger{color:#b4453f}
.btn.sm{padding:5px 8px;font-size:11px}
.pill{display:inline-block;font-size:9.5px;background:rgba(185,133,142,.16);color:var(--rose);
  border-radius:10px;padding:1px 7px}
.empty{text-align:center;color:var(--ink-2);font-size:12px;line-height:2;padding:26px 10px}
.empty svg{width:26px;height:26px;opacity:.45;margin-bottom:6px}
.soon-note{font-size:10px;color:var(--ink-3);line-height:1.75;padding:6px 2px 0}
.done-tag{display:inline-block;font-size:9.5px;color:var(--ink-3);border:1px dashed rgba(182,166,170,.7);
  border-radius:10px;padding:1px 7px;margin-left:4px}
/* 设置页：开关与数字输入（本单自己加的控件，冻结片不产出） */
.li input[type="checkbox"]{width:20px;height:20px;flex:none;accent-color:#ad657f;cursor:pointer}
.pair{display:flex;align-items:center;gap:8px}
.pair .inp{flex:1;min-width:0;text-align:center}
.pair .sep{font-size:11px;color:var(--ink-3);flex:none}
.set-hint{font-size:10px;color:var(--ink-3);line-height:1.7;margin-top:4px}
.soon-list{font-size:11px;line-height:2;color:var(--ink-2)}

/* ============================================================
   C. 弹层 / toast（冻结片的 openSheet / toast 直写这几个 id）
   ============================================================ */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:none}
.sheet-wrap.on{display:block}
.sheet-mask{position:absolute;inset:0;background:rgba(60,48,54,.32);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow-y:auto;
  background:linear-gradient(180deg,#fff,#fdf6f8);border-radius:24px 24px 0 0;
  padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -12px 34px rgba(122,100,110,.24)}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:rgba(150,120,130,.28);margin:2px auto 12px}
.sheet h3{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:12px}
.sheet-acts{display:flex;gap:8px;margin-top:14px}
.sheet-acts .btn{flex:1;justify-content:center;padding:11px}
.toast-layer{position:absolute;left:0;right:0;bottom:86px;z-index:30;display:flex;flex-direction:column;
  align-items:center;gap:6px;pointer-events:none}
.toast{max-width:78%;background:rgba(74,60,66,.9);color:#fff;font-size:11.5px;line-height:1.5;
  padding:8px 14px;border-radius:14px;transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(6px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none}

/* ============================================================
   皮肤二：黑白灰（照抄 23 的 body.mono 覆盖规则）
   纯白卡 + 极淡阴影 + 深灰描边；雾感底/织物纹/波点/蕾丝全部撤掉，
   毛玻璃关掉（在黑白灰里它是杂色来源），emoji 类字形整行去色。
   ============================================================ */
body.mono{--ink:#3d3d3d;--ink-2:#8c8c8c;--ink-3:#b3b3b3;--rose:#4a4a4a;--line:rgba(255,255,255,.92);
  /* 与 .wall 同族的去色主题底（原来这里是 #f2f2f2，机型框放大后露出的缝会显成一条灰边） */
  background:linear-gradient(172deg,#fdfdfd 0%,#f5f5f5 52%,#ebebeb 100%);color:#3d3d3d}
body.mono .wall{background:
  radial-gradient(120% 55% at 78% 2%,#ffffff 0%,rgba(255,255,255,0) 64%),
  radial-gradient(90% 46% at 8% 26%,#fafafa 0%,rgba(250,250,250,0) 66%),
  linear-gradient(172deg,#fdfdfd 0%,#f5f5f5 52%,#ebebeb 100%)}
body.mono .weave,body.mono .dots,body.mono .lace{display:none}
body.mono .deco i{color:#c9c9c9;text-shadow:0 0 6px rgba(255,255,255,.9)}
body.mono .g{background:linear-gradient(168deg,#ffffff,#ffffff 58%,#fdfdfd);
  border-color:rgba(255,255,255,.92);
  -webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:0 10px 26px rgba(70,70,70,.07),0 2px 6px rgba(70,70,70,.035),inset 0 1px 0 #fff}
body.mono .g::after{border-color:rgba(0,0,0,.035)}
body.mono .w-fn .av{background:linear-gradient(150deg,#e6e6e6,#cfcfcf)}
body.mono .w-lib .ic{background:linear-gradient(150deg,#e6e6e6,#cfcfcf)}
body.mono .w-lib .btn{background:#4a4a4a}
body.mono .bdg{background:#4a4a4a}
body.mono .app .ic{background:rgba(255,255,255,.75);border-color:rgba(0,0,0,.05)}
body.mono .app .lb{color:#4a4a4a}
body.mono .polaroid{box-shadow:0 8px 20px rgba(70,70,70,.10),0 1px 3px rgba(70,70,70,.06)}
/* 拍立得照片位在黑白灰下去色 */
body.mono .ph2{background-image:radial-gradient(70% 70% at 70% 30%,#f4f4f4,#dedede 62%,#c4c4c4);filter:grayscale(1)}
body.mono .ph3{background-image:radial-gradient(70% 70% at 40% 40%,#f6f6f6,#e0e0e0 60%,#c6c6c6);filter:grayscale(1)}
/* 双人纪念日大卡（黑白灰） */
body.mono .w-pair .bg{background-image:
  radial-gradient(55% 70% at 18% 18%,#ffffff,transparent 62%),
  radial-gradient(45% 55% at 82% 26%,#f0f0f0,transparent 68%),
  radial-gradient(60% 55% at 62% 96%,#c8c8c8,transparent 74%),
  linear-gradient(158deg,#ededed 0%,#d9d9d9 62%,#c1c1c1 100%)}
body.mono .w-pair .sheet{background:linear-gradient(180deg,#ffffff,#ffffff)}
body.mono .w-pair .nm{color:#3d3d3d}
body.mono .w-pair .days{color:#6e6e6e}
body.mono .w-pair .hrt{color:#9a9a9a}
body.mono .w-pair .en{color:rgba(120,120,120,.55)}
body.mono .w-pair .ava{color:#6e6e6e}
body.mono .w-pair .meta{color:#a0a0a0}
/* 应用屏（黑白灰）：白底 + 细描边，关掉毛玻璃 */
body.mono .app-view::before{background:linear-gradient(172deg,#fdfdfd 0%,#f6f6f6 52%,#eeeeee 100%)}
body.mono .abtn,body.mono .cbtn,body.mono .cpanel button,body.mono .btn,
body.mono .chips button,body.mono .inp,body.mono .sel,body.mono #chatInput{background:#fff;border-color:rgba(0,0,0,.06)}
body.mono .composer{background:rgba(255,255,255,.86);border-top-color:rgba(0,0,0,.05)}
body.mono .bubble{background:#fff;border-color:rgba(0,0,0,.05);color:#3d3d3d;box-shadow:0 3px 10px rgba(70,70,70,.05)}
body.mono .bubble.card{background:#fff;border-color:rgba(0,0,0,.09)}
body.mono .mrow.me .bubble{background:#eaeaea;color:#2f2f2f;border-color:rgba(0,0,0,.05)}
body.mono .mav{background:linear-gradient(150deg,#e6e6e6,#cfcfcf);box-shadow:none}
body.mono .sbar{background:rgba(255,255,255,.86);color:#7a7a7a}
body.mono .typing{background:#fff;border-color:rgba(0,0,0,.05)}
body.mono .card{background:#fff;border-color:rgba(0,0,0,.05);box-shadow:0 3px 10px rgba(70,70,70,.04)}
body.mono .cbtn.send,body.mono .btn.dark,body.mono .chips button.on{background:#4a4a4a;color:#fff;border-color:transparent}
body.mono .btn.danger{color:#8c8c8c}
body.mono .pill{background:rgba(0,0,0,.06);color:#5a5a5a}
body.mono .sheet{background:#fff}
body.mono .sheet-mask{background:rgba(40,40,40,.28)}
body.mono .toast{background:rgba(60,60,60,.92)}

body:not(.mono) .abtn,body:not(.mono) .cbtn,body:not(.mono) .cpanel button,body:not(.mono) .btn,
body:not(.mono) .chips button,body:not(.mono) .inp,body:not(.mono) .sel,body:not(.mono) #chatInput{

body:not(.mono) .cbtn.send,body:not(.mono) .btn.dark,body:not(.mono) .chips button.on{background:#ad657f;color:#fff}
body:not(.mono) .composer{background:rgba(255,251,252,.58)}
body:not(.mono) .bubble{background:rgba(255,252,253,.94);border-color:rgba(255,255,255,.92);color:#4f3f45}

/* End baby pink theme */

/* ============================================================
   D. 键盘可用性 + 视口适配
   ------------------------------------------------------------
   · :focus-visible：可点的 div 都带 role/tabindex（见 02_shell_body.html），
     键盘走到它们时必须看得见焦点。
   · 视口适配：本单交付的是 **390×844 的机型框**（与版式稿一致，框内不做重排）。
     视口比框小的时候（老机型 375×667 等），由 03_shell.js 的 fit() 按
     min(视口宽/390, 视口高/844) 整框等比缩放，保证任何尺寸下都看得到**完整**界面，
     而不是把底部裁掉。
     ⚠️ 这**不是**响应式重排的替代品：框内的字号/栅格/间距全是版式稿的定值。
        真要小屏重排（例如把 4 列栅格改成 3 列、把 224px 照片列改窄），那是设计决定，
        需要另行出稿 —— 本单不擅自改设计。
   ============================================================ */
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,
select:focus-visible,[role="button"]:focus-visible{outline:2px solid #ad657f;outline-offset:2px}
body.mono button:focus-visible,body.mono [role="button"]:focus-visible{outline-color:#4a4a4a}

/* ============================================================
   E. 第1单第16条 · 消息引用（双向）
   ------------------------------------------------------------
   · 四个件：气泡里的**引用块** / 输入条上方的**待引用条** /
     点气泡弹出的**操作菜单**（复制 · 引用）/ 跳回原消息的**高亮**。
   · 颜色一律走本壳已有变量（--ink / --ink-2 / --ink-3 / --rose / --line），
     所以 body.mono 与 Baby pink 两套皮肤自动都成立 —— 工单表要求
     「换成任意气泡皮肤后引用块都要正常」。body.mono 只补两处中性灰。
   · 字号全部 ≥11px：本壳最小字号是**版式稿自带**的 9px（.go / .bdg），
     新加的件不许再往下压，否则最小字号只会更差。
   ============================================================ */
/* 引用块：在气泡正文**上方**，灰底 + 左竖线 + 小字「引用 X 的消息」+ 原文快照 */
.q-blk{display:block;margin:0 0 6px;padding:5px 9px;border-left:2px solid var(--rose);
  border-radius:2px 9px 9px 2px;background:rgba(150,120,130,.11);
  font-size:11px;line-height:1.5;color:var(--ink-2);cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-blk .q-w{display:block;font-size:11px;color:var(--ink-3);margin-bottom:1px}
.q-blk .q-t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.me .q-blk{background:rgba(255,255,255,.42)}
/* 待引用条：夹在面板与输入条之间（不碰 composer 自身布局） */

/* ============================================================
   F. 第5单 · 信箱（写信）
   ------------------------------------------------------------
   · 片（`lib/33_letter.js`）自己产出 markup 与类名（ltcard / lt-paper / lt-tags …）。
     本单只**给这些类名写本单自己的样子** —— 不抄 19 的类名取值、不抄像素
     （说明书：UI 是每个客单自己的，源客单的 CSS 不当契约）。
   · 骨架类（card / empty / btn / btn-row / field / inp / chips / sechd / li-s / soon-note）
     直接吃本壳已有样式，所以这里只补信纸相关的这几件。
   · 颜色一律走本壳变量，body.mono 只补中性灰 ⇒ 两套皮肤自动都成立。字号 ≥11px。
   · ⚠️ **特异性陷阱（实测踩过）**：本壳的皮肤覆盖是 `body:not(.mono) .card{…}`（0,2,1），
     比 `.ltcard.unread`（0,2,0）高 ⇒ 只写裸类名会被它盖掉，症状是**静默的**：
     `border-left-width` 照样生效（那条只设颜色），可**颜色不变**、底色也不变 ——
     「未读信高亮描边」看着像做了，其实没呈现。所以粉色皮肤下要用同形的
     `body:not(.mono) .ltcard.unread`（0,3,1）把它压回去。探针实测：
     裸规则下 computed 是 `rgba(255,255,255,.9)`（壳的 --line），加限定后才是 `#b9858e`。
   ============================================================ */
.lt-hint{display:flex;align-items:center;gap:6px;font-size:11px;line-height:1.6;
  color:var(--ink-2);padding:2px 2px 8px}
.lt-hint svg{width:14px;height:14px;flex:none;opacity:.7}
/* 列表项：**未读信高亮描边**（工单第1条）。用 border-color 表达，可被 computed style 量到 */
.ltcard{border-left:3px solid transparent}
.ltcard.unread{border-color:var(--rose);border-left-width:3px;background:rgba(185,133,142,.10)}

/* 信纸：衬线 + 行高（工单第2条「信纸样式」），写信页与读信页共用同一个观感 */

/* 同一条特异性陷阱：写信/读信的信纸是 `.card.lt-paper`，底色也会被 `body:not(.mono) .card` 盖掉 */
body:not(.mono) .lt-paper{background:linear-gradient(178deg,rgba(255,255,255,.95),rgba(255,252,253,.88))}

.lt-body{color:var(--ink)}
.lt-body .lt-l{margin:0 0 9px}
.lt-body .lt-l:last-child{margin-bottom:0}

body.mono .ltt.in{background:rgba(0,0,0,.09);color:#3d3d3d}

/* ---------- H 段：设置中心 · 名字 / 头像 / 壁纸（第15单） ----------
   只加「预览」这两个盒子；控件沿用本壳已有的 .card / .field / .inp / .li / .btn / .btn-row。

.set-row{display:flex;align-items:center;gap:10px}

.set-row .btn{flex:none}
.set-av{width:44px;height:44px;border-radius:14px;flex:none;overflow:hidden;

body.mono .set-av{background:linear-gradient(150deg,#e6e6e6,#cfcfcf);color:#5a5a5a}
.set-th{width:64px;height:38px;border-radius:9px;flex:none;border:1px dashed var(--line);
  background-color:rgba(255,255,255,.7);background-position:center;background-size:cover;background-repeat:no-repeat;
  display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--ink-3)}

/* ============================================================
   手机端：**直接铺满视口**（不套机型框、不做等比缩放）
   ------------------------------------------------------------
   ⚠️ 这一段必须留在样式表**最末尾**：它覆盖的是前面 `.stage` / `.phone` / `.board` 的基础规则，
      同权重下**后写的赢**。第一版把它插在 `.phone` 后面（即 `.board{flex:0 0 auto}` **之前**），
      结果被基础规则盖了回去 —— 症状是「媒体查询写了却不生效」：`.board` 实测高 766px
      （内容自然高）而屏只有 568px，底部卡片够不着。挪到末尾后实测生效。
   ------------------------------------------------------------
   2026-10-17 用户第二次反馈同一条：「背景填不满画面…手机端要全屏、不要左右拖动那种」。
   实测（真移动端模拟，判据见 _work/verify.mjs 的 [T] T9 矩阵）：
     固定 390×844 画布 + fit() 的 **contain（取 min）** 缩放 ⇒ 屏幕比 390:844 **更矮而宽**时
     按高度定标，机型框两侧空出 **9~32px**（320×568 空 29px、360×640 空 32px、360×740 空 9px），
     桌面那条渐变底从缝里透出来 = 用户说的「填不满」；
     而 transform **不改变布局尺寸**（布局宽度恒为 390）⇒ 屏宽 <390 时文档比屏幕宽，
     真机浏览器允许视觉视口平移时就是「能左右拖」。
   做法：窄视口下机型框尺寸**跟着视口走**（1:1、不缩放）；框内排版本来就是
     flex 列 + 可滚动区（`.abody` / `.thread`），高度差由它们吸收 ⇒ 任何机型都铺满且内容够得着。
   宽视口（桌面预览）**刻意保留**居中的机型框观感 —— 那是有意保留的设计，不是漏改。
   ⚠️ 条件里除了宽度还有 **`(pointer:coarse)`（触屏）**：真机把网址当"桌面版网站"打开时
      `<meta viewport>` 会被忽略、布局视口变 980 ⇒ 只按宽度判就**修不到**（手机仍看到中间一个小框）。
      触屏信号与布局视口无关，能覆盖「桌面模式 / 横屏 / 平板」这些情形；桌面（细指针）实测为 false，
      所以桌面预览的机型框一个像素不变（见 _work/verify.mjs T9c/T9d 的桌面上下文对照）。
   ⚠️ 用 `100%` 而不是 `100vw`：`100vw` 在某些浏览器里**含纵向滚动条宽度** ⇒ 会比屏宽多出十几 px
      （正是"能左右拖"的那一类毛病）；`100%` 取的是包含块宽度，不含滚动条。
      高度用 `100%` 还能白拿 body 上 `height:100vh;height:100dvh` 的降级链（老安卓不认 dvh 时落到 vh）。
   ⚠️ 这个 520 与 `03_shell.js` 的 fit() 里那个 520 **必须一致**（构建期有闸门钉着）。 */
@media (max-width:520px),(pointer:coarse){
  .stage{width:100%;height:100%}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
  /* 首页是固定行高的栅格（--row-h:78px）：矮屏上比屏幕高时让**栅格自己滚**，绝不裁掉内容。
     给它 flex:1 + min-height:0 才有可滚动的约束高度（只写 overflow 是不起作用的）。 */
  .board{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  /* 内容避让刘海/圆角（meta 里已 viewport-fit=cover）：只补内容层，不动背景层 .wall */
  #desk,#appInner{padding-top:env(safe-area-inset-top,0px)}
}
/* 手机端「能左右拖」的兜底：任何情况下都不许横向溢出。
   body 上已有 overflow:hidden，但真机（部分 Android / 内嵌浏览器）在内容比屏宽时
   仍允许视觉视口平移；根元素这一条把横向滚动的口子彻底关掉。 */
html{overflow-x:hidden;max-width:100%}
</style>
</head>
<body>
<!-- ============================================================
     客单30 · 字卡传讯 —— 外壳 body
     版式与《主屏版式稿-字卡传讯2.html》逐条一致；
     新增的只有四类东西（都有注释标出）：
       · 活的控件挂点：#hm* / data-app
       · 应用屏容器：#appScreen > #appInner（冻结片的屏渲染进这里）
       · 冻结片直写的宿主容器：#sheetWrap / #sheet / #toastLayer / #libFile
       · 无障碍：可点的 div 给 role/tabindex（data-app 走外壳委托）
     ============================================================ -->
<div class="stage"><div class="phone">
  <div class="wall"></div><div class="weave"></div><div class="dots"></div>
  <div class="deco">
    <i style="left:26px;top:120px">✦</i>
    <i style="right:34px;top:210px;color:#cf94a0">♡</i>
    <i style="left:18px;top:430px;color:#cf94a0">♡</i>
    <i style="right:22px;bottom:150px">✦</i>

  <div class="screen" id="desk">
    <div class="skin-switch">
      <button id="sk-pink" class="on" type="button">粉白</button>
      <button id="sk-mono" type="button">黑白</button>
    </div>

    <div class="board">
      <!-- ① 双人纪念日大卡（第13单已接：字段全是**真数据**，两区点击） -->
      <!-- 点击分区（按用户明确要求）：白区 .sheet + 双人头像 → 进纪念日设置；
           灰区 .bg（渐变那张 = 相片槽那块）→ 换卡片背景图。
           注：.avaRow 是跨在分界线上的绝对定位装饰层，CSS 里 pointer-events:none，
           点击会穿到它下面那一区；两颗 .ava 自己承接「进纪念日」。
           ⚠️ 左右顺序（2026-10-17 用户明确要求调换）：**左=梦角(#hmPairAva)、右=我(#hmPairAvaMe)**，
           与版式稿相反（稿上是「我 ♡ 梦」）——这是**用户指定的偏离**，别照稿改回去。
           id 与数据的绑定关系不变（`03_shell.js` 的 paintPairAva 不用动）。 -->
      <div class="g span4r3 w-pair">
        <div class="bg" id="hmAnnBg" data-act="anniv-bg" role="button" tabindex="0" aria-label="换卡片背景图"></div>
        <div class="sheet" data-app="anniv" role="button" tabindex="0" aria-label="纪念日设置">

          <div class="meta"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span id="hmAnnMeta">去纪念日里加一条，这里就会显示</span></div>
        </div>
        <div class="avaRow">
          <div class="ava" id="hmPairAva" data-app="anniv" role="button" tabindex="0" aria-label="纪念日设置">梦</div>
          <div class="hrt">♡</div>

        </div>

      <!-- ② 聊天（活卡：名字 / 最后一条 / 未读角标都取自状态树） -->
      <div class="memory-layout">
      <div class="g w-fn message-chat" data-app="chat" role="button" tabindex="0" aria-label="进入聊天">
        <div class="hd">
          <div class="av"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.2" y="4.1" width="15.6" height="12.6" rx="3.2"/><path d="M8.6 16.7V20l4-3.3"/></svg></div>
          <div class="tt" id="hmChatName">梦角</div>
        </div>
        <div class="pv" id="hmChatPv">还没有聊天记录</div>

        <span class="bdg off" id="hmChatBdg">0</span>
      </div>

      <!-- ③ 信件（第5单已接：预览与未读角标都取自状态树，不是装饰数） -->
      <div class="g w-fn message-mail" data-app="letter" role="button" tabindex="0" aria-label="信箱">
        <div class="hd">
          <div class="av"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg></div>
          <div class="tt">来信</div>

        <div class="pv" id="hmLetPv">还没有信，点开写一封</div>

        <span class="bdg off" id="hmLetBdg">0</span>

      <!-- ④ 一整张微倾的拍立得（单图）—— 2026-10-17 用户要求：**点击可上传相册图片**
           （原来写的是「纯装饰，不可点」）。交互与第13单大卡灰区同款：
           没有图 → 直接开选图；已有图 → 给「换一张 / 恢复默认」两条路（传错了不能是死路）。

      <div class="polaroid-cell">

      </div>

      <!-- ⑤ 字卡库入口（活条：张数 / 参与抽卡数取自卡池；「抽一张」让 TA 抽一张回你） -->
      <div class="g w-lib draw-strip">
        <div class="ic" data-app="cards" role="button" tabindex="0" aria-label="打开字卡库"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M7 10h10M7 14h6"/></svg></div>

      <!-- ⑥ 应用图标行（四个都是活的：聊天 / 字卡库 / 信箱 / 设置） -->
      <div class="apps" style="grid-column:span 4">
        <div class="app" data-app="chat" role="button" tabindex="0" aria-label="聊天">
          <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4.2" y="4.1" width="15.6" height="12.6" rx="3.2"/><path d="M8.6 16.7V20l4-3.3"/></svg></div>
          <div class="lb">聊天</div>
        </div>
        <div class="app" data-app="cards" role="button" tabindex="0" aria-label="字卡库">
          <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M7 10h10M7 14h6"/></svg></div>
          <div class="lb">字卡库</div>
        </div>
        <div class="app" data-app="letter" role="button" tabindex="0" aria-label="信箱">
          <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg></div>
          <div class="lb">信箱</div>
        </div>
        <div class="app" data-app="settings" role="button" tabindex="0" aria-label="设置">
          <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.9 19l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 13.6H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></div>
          <div class="lb">设置</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 应用屏（会话 / 字卡库 / 设置 / 占位）：冻结片渲染进 #appInner ===== -->
  <section class="app-view" id="appScreen" aria-hidden="true">
    <div id="appInner"></div>
  </section>

  <!-- ===== 冻结片直写的宿主容器（id 不能改：10_core.js 里是写死的） ===== -->
  <div class="sheet-wrap" id="sheetWrap">
    <div class="sheet-mask" data-act="sheet-close"></div>
    <div class="sheet" id="sheet"></div>
  </div>
  <div class="toast-layer" id="toastLayer"></div>
  <!-- 全站唯一隐藏文件输入：字卡库「导入」走它 -->
  <input type="file" id="libFile" accept=".json,application/json" class="hide">
  <!-- 第13单：主屏纪念日大卡灰区的背景图（单独的输入框，不与 libFile 混用分流） -->
  <input type="file" id="annivBgFile" accept="image/*" class="hide">
  <!-- 设置中心的选图入口（第15单·名字/头像/壁纸）：本人头像 / TA 头像 / 桌面壁纸 / 聊天背景
       共用这一个 input，按 RT.upPending 分流（`av:me` / `av:ta` / `wall:home` / `wall:chat`）。
       独立输入框是有意的：第5单那次「取消导入留下 pending 标记」的教训说明一个输入框走两条
       分流容易出事，所以这里连**分流标记**也各用各的（RT.upPending 与 RT.letPending 互不干扰）。 -->
  <input type="file" id="setFile" accept="image/*" class="hide">
  <!-- 主屏拍立得的相片位（2026-10-17 用户要求可上传）。独立输入框、独立分流：
       与 libFile / annivBgFile / setFile 各走各的（沿用第5单「一个输入框走两条分流容易出事」的教训）。 -->
  <input type="file" id="polaroidFile" accept="image/*" class="hide">
  <!-- base 宿主接口的自定义样式槽（本单未接美化，留给后续） -->
  <style id="cssUser"></style>
</div></div>
<script>
/* ============================================================
   03_shell.js · 客单30 外壳（主屏版式 + 应用屏容器 + 事件委托 + 皮肤）
   ------------------------------------------------------------
   分工（与 29/27 同一条接缝约定）：
     · 外壳（本文件）：主屏渲染、皮肤、层的显隐、点击/键盘委托。
       它**不认识**状态树，只调 DOTTIE 提供的接口。
     · 接入层（_src/adapter.js）：路由与屏渲染、动作表、设置、调度。
       它**不画主屏**，只通过 DOTTIE.repaintHome() 让外壳重画。

   ⚠️ 三条硬约定（29 实测：违反后都是「零报错静默失效」）：
     1) window.DOTTIE **只在这里整体赋值一次**；接入层用 Object.assign 覆盖上来。
        另外起一个全局名（window.__dottie 之类）会让所有调用落在本文件的空实现上。
     2) 默认实现**不许沉默**：真被调用到就 console.error + 给用户一句中文提示。
     3) 接入层接上后会置 D.wired；本文件在 boot 后核一次，没置就把问题显式说出来。
   ============================================================ */
(function () {
  'use strict';

  var SKIN_KEY = 'skin-zhikachuanxun';   /* 与版式稿同键：从版式稿切过来时保留用户的选择 */

  /* ---------- 1. 唯一的安全默认实现（接入层会用 Object.assign 覆盖） ---------- */
  var DOTTIE = window.DOTTIE = {
    wired: '',
    /* 外壳自己实现的（接入层会调它们） */
    showApp: function (on) {
      var el = document.getElementById('appScreen');
      if (el) {
        el.classList.toggle('on', !!on);
        el.setAttribute('aria-hidden', on ? 'false' : 'true');
      }
      document.body.classList.toggle('app-on', !!on);
    },
    repaintHome: function () { renderHome(data()); }
  };

  /* 接入层必须提供的接口：先给「不沉默」的占位，真接上了会被覆盖。
     ⚠️ 这些占位**故意会报错**：接到空实现还一声不吭，就是 29 踩过的那个坑。
     ⚠️ 这张表**只是外壳真的会调用的那些**（闸门 S13 逐个核对）。
        验收脚本要用的 msgs/stats 之类不放在这里 —— 它们在 __co30 上，
        放进这张表等于声明一个谁都不打的接口。 */
  function notWired(name) {
    return function () {
      try { console.error('[shell] DOTTIE.' + name + ' 没有被接入层覆盖（接线失败）'); } catch (e) {}
      return null;
    };
  }
  var SHELL_API = ['open', 'close', 'homeData', 'onEnter', 'drawOne'];
  SHELL_API.forEach(function (k) { DOTTIE[k] = notWired(k); });
  DOTTIE.act = function () {
    try { console.error('[shell] DOTTIE.act 没有被接入层覆盖（接线失败）'); } catch (e) {}
    return false;
  };

  /* ---------- 2. 皮肤（照抄版式稿：只切 body 上的 mono 类） ---------- */
  function applySkin(mono) {
    document.body.classList.toggle('mono', !!mono);
    var p = document.getElementById('sk-pink'), m = document.getElementById('sk-mono');
    if (p) p.classList.toggle('on', !mono);
    if (m) m.classList.toggle('on', !!mono);
    try { localStorage.setItem(SKIN_KEY, mono ? 'mono' : 'pink'); } catch (e) {}
  }

  /* ---------- 3. 主屏渲染（只读 DOTTIE.homeData() 给的数据） ---------- */
  var LAST = null;
  function data() {
    var d = DOTTIE.homeData();
    return (d && typeof d === 'object') ? d : {};
  }
  function text(id, v) {
    var el = document.getElementById(id);
    if (el && el.textContent !== String(v)) el.textContent = String(v);
  }
  function renderHome(d) {
    LAST = d || {};
    text('hmChatName', LAST.name || '梦角');
    text('hmChatPv', LAST.preview || '还没有聊天记录');
    var bdg = document.getElementById('hmChatBdg');
    if (bdg) {
      var n = Math.max(0, Number(LAST.unread) || 0);
      bdg.textContent = n > 99 ? '99+' : String(n);
      bdg.classList.toggle('off', n === 0);
      bdg.setAttribute('aria-hidden', n === 0 ? 'true' : 'false');
    }
    text('hmLibN', Number(LAST.cardTotal) || 0);
    text('hmLibSub', '参与抽卡 ' + (Number(LAST.cardVisible) || 0) + ' 张');
    /* 第5单 信箱：信件卡的预览与未读角标也是**真数据**（19 的主屏同样读 letterAllUnread()） */
    text('hmLetPv', LAST.letterPv || '还没有信，点开写一封');
    var letBdg = document.getElementById('hmLetBdg');
    if (letBdg) {
      var ln = Math.max(0, Number(LAST.letterUnread) || 0);
      letBdg.textContent = ln > 99 ? '99+' : String(ln);
      letBdg.classList.toggle('off', ln === 0);
      letBdg.setAttribute('aria-hidden', ln === 0 ? 'true' : 'false');
    }
    /* 纪念日大卡（第13单）：每个字段都是**真数据**（接入层 homeData 算好的），
       一条都没有时给诚实空态 —— 版式稿那串静态假数字（两周年 / 14 / 从 2026-10-31 开始）
       在接上状态树的那一刻就该消失，留着就是「界面在撒谎」。 */
    var anNm = document.getElementById('hmAnnNm');
    if (anNm) anNm.textContent = String(LAST.annivNm || '还没有纪念日');
    var anDays = document.getElementById('hmAnnDays');
    if (anDays) {
      /* 「14 days」的小字后缀由外壳决定：没有纪念日时写「加一条」，不写 "days"。
         ⚠️ 本文件是外壳 IIFE，**没有** esc()（那是冻结片 10_core.js 的全局函数）——
            所以这里不用 innerHTML 拼串，改成纯 DOM 组装：构造上就不可能注入。 */
      var dv = String(LAST.annivDays == null ? '' : LAST.annivDays);
      anDays.textContent = '';
      if (LAST.annivHas) {
        anDays.appendChild(document.createTextNode(dv));
        var sp = document.createElement('span');
        sp.textContent = 'days';
        anDays.appendChild(sp);
      } else {
        anDays.appendChild(document.createTextNode(dv || '加一条'));
      }
    }
    var anEn = document.getElementById('hmAnnEn');
    if (anEn) anEn.textContent = String(LAST.annivQuote || '✦ thoughts of you ✦');
    var anMeta = document.getElementById('hmAnnMeta');
    if (anMeta) anMeta.textContent = String(LAST.annivMeta || '');
    var pair = document.querySelector('.w-pair');
    if (pair) pair.classList.toggle('is-empty', !LAST.annivHas);
    var anBg = document.getElementById('hmAnnBg');
    if (anBg) {
      var bgUrl = String(LAST.annivBg || '');
      if (bgUrl) anBg.style.backgroundImage = 'url("' + bgUrl.replace(/"/g, '%22') + '")';
      else anBg.style.backgroundImage = '';
      anBg.classList.toggle('has-img', !!bgUrl);
      anBg.setAttribute('aria-label', bgUrl ? '换卡片背景图（已有自定义背景）' : '上传图片作为卡片背景');
    }
    /* 主屏拍立得的相片位（2026-10-17 用户要求可上传）：与大卡背景同款 ——
       有图铺图（inline background-image 盖过 .ph2 的默认渐变），没有就退回那层渐变。
       会话屏每次进屏重画 ⇒ 这一处必须挂在 renderHome 里（开机 / 回桌面 / 重画都走到）。 */
    var po = document.getElementById('hmPolaroid');
    if (po) {
      var poUrl = String(LAST.polaroidBg || '');
      if (poUrl) po.style.backgroundImage = 'url("' + poUrl.replace(/"/g, '%22') + '")';
      else po.style.backgroundImage = '';
      po.classList.toggle('has-img', !!poUrl);
    }
    /* 双人头像：字跟着真名走；有头像图（S.avatars）时铺图，否则退回首字。 */
    var meAva = document.getElementById('hmPairAvaMe');
    if (meAva) paintPairAva(meAva, LAST.avaMe);
    var taAva = document.getElementById('hmPairAva');
    if (taAva) paintPairAva(taAva, LAST.avaTa);
  }
  /* 一张圆形头像：有图就用图（img 铺满，CSS 已有 .w-pair .ava img），没有就写首字。
     两种来源都是**真数据**（S.avatars.me / taAv(cid)），不是装饰。 */
  function paintPairAva(el, o) {
    var ch = String((o && o.ch) || '');
    var av = String((o && o.av) || '');
    var img = el.querySelector('img');
    /* ⚠️ 本单实测的坑（真机判据抓到的）：原来这里用 `el.textContent = ''` 清首字 ——
       `textContent` 的写入会**删掉该元素的全部子节点**，于是刚插进去的 `<img>` 一起被删，
       表现是「上传头像后主屏大卡上没图，再进一次屏/再刷新才有」。
       清文字只清**文字节点**，绝不碰 img。 */
    var dropText = function () {
      Array.prototype.slice.call(el.childNodes).forEach(function (n) {
        if (n !== img && n.nodeType === 3) el.removeChild(n);
      });
    };
    if (av) {
      if (!img) { img = document.createElement('img'); img.alt = ''; }
      if (img.getAttribute('src') !== av) img.setAttribute('src', av);
      dropText();
      if (el.firstChild !== img) el.insertBefore(img, el.firstChild);
    } else {
      if (img && img.parentNode) img.parentNode.removeChild(img);
      dropText();
      if (el.textContent !== ch) el.textContent = ch;
    }
  }

  /* ---------- 4. 导航 ---------- */
  var current = 'home';
  function go(view, arg) {
    if (view === 'home') { back(); return; }
    var ok = DOTTIE.open(view, arg);
    if (ok !== false) current = view;
  }
  function back() {
    DOTTIE.close();
    current = 'home';
  }
  function sheetOpen() {
    var w = document.getElementById('sheetWrap');
    return !!(w && w.classList.contains('on'));
  }

  /* ---------- 5. 事件委托（一处，就近祖先查找） ---------- */
  /* 第13单：anniv 由 'soon' 改成真屏 'anniv'（纪念日已接入）。
     ⚠️ 这个映射与接入层的 ROUTE_OF / screenOf 三处**必须一致**，错一处就静默落占位屏。 */
  var APP_ROUTE = { chat: 'chat', cards: 'cards', settings: 'settings', letter: 'letter', anniv: 'anniv' };
  function closestEl(t, sel) {
    var el = t;
    while (el && el.nodeType === 1 && el !== document.body) {
      if (el.matches && el.matches(sel)) return el;
      el = el.parentNode;
    }
    return null;
  }
  function onApp(el) {
    var key = el.getAttribute('data-app');
    /* 「抽一张」不是「打开某个屏」，它是一次动作：让 TA 现在就从字卡库抽一张回你。
       少了这个分支，它会掉进下面的 soon 兜底 → 点「抽一张」弹「draw 还没有迁移进来」。 */
    if (key === 'draw') { DOTTIE.drawOne(); return; }
    var route = APP_ROUTE[key] || 'soon';
    go(route, route === 'soon' ? key : undefined);
  }
  function onClick(e) {
    /* 冻结片的动作优先：它们由接入层的动作表实现 */
    var actEl = closestEl(e.target, '[data-act]');
    if (actEl) {
      var handled = DOTTIE.act(actEl.getAttribute('data-act'), actEl, e);
      if (handled !== false) { e.preventDefault(); return; }
    }
    var appEl = closestEl(e.target, '[data-app]');
    if (appEl) { e.preventDefault(); onApp(appEl); return; }
    /* 点空白处：应用的浮层面板收起来（会话输入条上方那块） */
    if (!closestEl(e.target, '.composer') && !closestEl(e.target, '#chatPanel')) {
      var cb = closestEl(e.target, '[data-panel-close]');
      if (cb) DOTTIE.act('panel-close', cb, e);
    }
  }
  function onKeydown(e) {
    var t = e.target;
    if (e.key === 'Enter' || e.key === ' ') {
      if (t && t.getAttribute && t.getAttribute('data-app') && t.getAttribute('role') === 'button') {
        e.preventDefault(); onApp(t); return;
      }
    }
    if (e.key === 'Escape') {
      if (sheetOpen()) { DOTTIE.act('sheet-close'); return; }
      if (current !== 'home') { back(); return; }
    }
    if (e.key === 'Enter' && t && t.id === 'chatInput' && !e.shiftKey) {
      /* 冻结片的 bindChat 已经绑了 Enter；这里只在它没跑到时兜底 */
      var el = t;
      if (el.__bound !== true && DOTTIE.onEnter) DOTTIE.onEnter(el);
    }
  }
  document.addEventListener('click', onClick, false);
  document.addEventListener('keydown', onKeydown, false);

  /* ---------- 6. 启动 ---------- */
  function initSkin() {
    var saved = null;
    try { saved = localStorage.getItem(SKIN_KEY); } catch (e) {}
    var p = document.getElementById('sk-pink'), m = document.getElementById('sk-mono');
    if (p) p.addEventListener('click', function () { applySkin(false); });
    if (m) m.addEventListener('click', function () { applySkin(true); });
    applySkin(saved === 'mono');
  }
  /* 机型框适配：
     · **手机（窄视口 或 触屏）**：不做任何缩放 —— 机型框由 CSS（@media (max-width:520px),(pointer:coarse)）
       直接铺满视口。这里**必须显式清掉 transform**：
       下面 resize 的两次尾部重算会再调本函数，若把旧 scale 留在行内样式上，
       手机会连"铺满"一起缩小（假铺满）。
       ⚠️ 2026-10-17 用户第二次反馈「背景填不满 + 手机端能左右拖」的根因就是这里原来无条件 contain 缩放：
          固定 390×844 画布在"矮而宽"的屏上按高度定标 ⇒ 两侧空 9~32px（填不满），
          而 transform 不改布局宽度（恒 390）⇒ 屏宽 <390 时文档比屏幕宽 ⇒ 能左右拖。
          触屏条件（pointer:coarse）是对「手机开了桌面版网站」那种布局视口 980 情形的加固。
     · **桌面（细指针且视口够宽）**：保留居中的机型框，等比缩放到视口内（框是有意保留的设计）。 */
  var FILL_MAX_W = 520;
  /* 与 `01_shell_head.html` 的媒体查询条件**逐字对应**：窄视口 **或 触屏**。
     ⚠️ 触屏那一条不能省：真机把网址当"桌面版网站"打开时 `<meta viewport>` 被忽略、
        布局视口变 980 ⇒ 只按宽度判就修不到（手机仍看到中间一个小框）。桌面细指针实测为 false。 */
  function fillMode() {
    if (window.innerWidth <= FILL_MAX_W) return true;
    return !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  }
  function fit() {
    var st = document.querySelector('.stage');
    if (!st) return;
    if (fillMode()) { st.style.transform = ''; return; }
    var s = Math.min(window.innerWidth / 390, window.innerHeight / 844);
    st.style.transform = s === 1 ? '' : 'scale(' + s + ')';
  }
  function boot() {
    initSkin();
    fit();
    /* ⚠️ 2026-10-17 加固（与上面 fit 去上限同一次改动，实测量出来的）：
       resize 事件**可能带着过渡中的中间尺寸到达** —— 实测从 412×915 切回 390×844 时，
       有一次事件读到的 innerWidth/innerHeight 是 401×868（正好是两头的中间值），
       fit() 据此算出 scale(1.0284)；而**过渡结束时不一定再派发一次 resize**，
       于是那个偏大的 scale 就一直挂在 .stage 上（真机上同理：只收到过渡态事件就会一直错）。
       做法：立刻算一次（响应要快），再挂两次**尾部重算**（120ms / 400ms）—— 视口稳定后自愈；
       两次是为了覆盖「过渡比 160ms 还慢」的情形（实测那次约 300ms 才稳定）。
       开销可以忽略（只在 resize 时排两个定时器）。 */
    var fitTimers = [];
    function fitSoon() {
      fitTimers.forEach(clearTimeout);
      fitTimers = [setTimeout(fit, 120), setTimeout(fit, 400)];
    }
    window.addEventListener('resize', function () { fit(); fitSoon(); });
    window.addEventListener('orientationchange', function () { fit(); fitSoon(); });
    window.addEventListener('pageshow', fit);
    /* 接线自检：接入层接上时必须置 wired，且主屏数据要拿得到 */
    setTimeout(function () {
      if (DOTTIE.wired !== 'co30-adapter') {
        try { console.error('[shell] 接入层没接上：DOTTIE.wired = ' + JSON.stringify(DOTTIE.wired)); } catch (e) {}
        var host = document.querySelector('.board');
        if (host && !document.getElementById('wireWarn')) {
          var w = document.createElement('div');
          w.id = 'wireWarn';
          w.className = 'soon-note';
          w.style.cssText = 'position:absolute;left:12px;right:12px;bottom:10px;text-align:center;color:#b4453f;z-index:9';
          w.textContent = '接入层没有接上：界面是死的，详情见控制台。';
          host.parentNode.appendChild(w);
        }
      }
    }, 400);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* 给验收脚本的只读把手（不改变任何判定） */
  window.__shell = {
    view: function () { return current; },
    home: function () { return LAST; },
    data: data
  };
})();
</script>
<script>
/* ===== 90_stubs.js ===== */
/* ============================================================
   90_stubs.js · 未迁移功能的占位层（**不是**简化实现）
   ------------------------------------------------------------
   本切片只迁移了：core / contacts / chat / cardlib。
   其余功能（表情包、一起听、通话、陪伴、问卷、链接测试、今日预感、
   美化、碎影、写信、日记、打卡、红包、礼物）尚未迁移。

   为什么需要占位：这些功能的「状态归一化」和「聊天消息渲染」被
   core / chat 直接调用（normS() 与 msgHTML() 里都有分支）。

   ----------------------------------------------------------

   聊天记录被吞）；IDB 的配额按磁盘算。所以图归 IDB，存档仍只放文字。

     ① 先写后删：图必须先**写进 IDB 并读回逐字节校验一致**，之后才允许从存档消失。
        任一组校验不过 → 整体不切，图原样留在存档里。
     ② 失败保留：IDB 打不开 / 写不进 / 配额不足 → **什么都不动**，
        行为完全退回「图存在 localStorage」，绝不先删。
   取巧处（照 13 的做法）：**IDB 里存的还是 dataURL 字符串**，开机一次性读回内存 ——
   冻结片的渲染路径（`avHTML` 的 `src=`、`#thread` 的 `url()`）**一行都不用改**。

   本单相对客单13 的**三处适配**（数据结构不同，不是行为改动）：
     · `wall` 这一组在本单是 **`{home, chat}` 两个键**（本单有两张壁纸：桌面 + 聊天）；
       13 只有一张 `S.wall.chat`。IDB 里仍然是**一个** `wall` 记录（硬规则的四组键不变）。
     · `contacts` 这一组取本单的 `S.avatars.taBy`（TA 头像按 cid 存，第22单口径）。
     · `emoji` 这一组**恒为空对象**：本单表情包未迁移（`FROZEN.json._scope`）。
       四组键仍然照写（硬规则要求的那四把钥匙都在），空组在 `idbPutVerified` 里直接算通过。
   ========================================================== */

var IDB_NAME = 'yl_media_db';          /* 与客单13 同名：将来两个产品之间搬档也认得出 */
var IDB_STORE = 'media';
var mediaInIdb = false;                /* 只有「IDB 可用 + 搬家校验通过」才置 true */
var idbHandle = null;
var idbNote = '';                      /* 设置页显示用：图片现在存在哪 */

function idbOpen() {
  return new Promise(function (res, rej) {
    if (!window.indexedDB) { rej(new Error('no indexedDB')); return; }
    var req = window.indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function () {
      var db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = function () { res(req.result); };
    req.onerror = function () { rej(req.error || new Error('open failed')); };
    req.onblocked = function () { rej(new Error('blocked')); };
  });
}
function idbPut(db, key, val) {
  return new Promise(function (res, rej) {
    var tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = function () { res(true); };
    tx.onerror = function () { rej(tx.error || new Error('put failed')); };
    tx.onabort = function () { rej(tx.error || new Error('put aborted')); };
  });
}
function idbGet(key) {
  return new Promise(function (res) {
    try {
      if (!idbHandle) { res(null); return; }
      var tx = idbHandle.transaction(IDB_STORE, 'readonly');
      var rq = tx.objectStore(IDB_STORE).get(key);
      rq.onsuccess = function () { res(rq.result === undefined ? null : rq.result); };
      rq.onerror = function () { res(null); };
    } catch (e) { res(null); }
  });
}
/* 内存里的图（老版本来自存档；搬过家之后是开机从 IDB 读回来的） */
function mediaCollect() {
  var contacts = {};
  var taBy = (S.avatars && S.avatars.taBy) || {};
  Object.keys(taBy).forEach(function (k) { if (taBy[k]) contacts[String(k)] = String(taBy[k]); });
  return {
    /* `wall` 这一组按硬规则20 的四组键名照写，值里多带一个 `anniv`：
       那是第13单的「纪念日大卡背景图」，也是**用户上传的图片** ——
       工单第20条写的是「一切用户图片」，且 L105 的机检要求「扫所有 key，data:image 次数为 0」，
       所以它必须跟头像/壁纸一起搬进 IDB（渲染路径一行都不用改，内存里仍是 S.annivBg）。 */
    wall: {
      home: (S.walls && S.walls.home) || '',
      chat: (S.walls && S.walls.chat) || '',
      anniv: S.annivBg || ''
    },
    me: (S.avatars && S.avatars.me) || '',

function mediaApply(m) {
  if (!m || typeof m !== 'object') return 0;
  var n = 0;
  if (m.wall && typeof m.wall === 'object') {
    if (typeof m.wall.home === 'string' && m.wall.home) { S.walls.home = m.wall.home; n++; }
    if (typeof m.wall.chat === 'string' && m.wall.chat) { S.walls.chat = m.wall.chat; n++; }
    /* 第13单的卡片背景图（也是用户上传的图片）—— 与壁纸同组 */
    if (typeof m.wall.anniv === 'string' && m.wall.anniv) { S.annivBg = m.wall.anniv; n++; }
  }
  if (typeof m.me === 'string' && m.me) { S.avatars.me = m.me; n++; }
  if (m.contacts && typeof m.contacts === 'object') {
    Object.keys(m.contacts).forEach(function (id) {

/* 写一组 + 读回逐字节校验；空组直接算通过（本来就没图可搬） */
function idbPutVerified(key, val) {
  var empty = (val === '' || val === null || val === undefined) ||
    (typeof val === 'object' && Object.keys(val).length === 0);
  if (empty) return Promise.resolve(true);
  if (!idbHandle) return Promise.resolve(false);
  return idbPut(idbHandle, key, val).then(function () {
    return idbGet(key).then(function (back) {
      if (typeof val === 'string') return back === val;          /* 字符串逐字节比对 */
      if (!back || typeof back !== 'object') return false;
      var a = Object.keys(val), b = Object.keys(back);
      if (a.length !== b.length) return false;
      for (var i = 0; i < a.length; i++) if (back[a[i]] !== val[a[i]]) return false;
      return true;
    });
  }).catch(function () { return false; });
}
/* 开机：先读 IDB（上次搬过去的），再把存档里还留着的图搬过去 */
function idbBoot(done) {
  mediaNormalizeContacts();                 /* 先把「c.av 是图」的老档归一进 taBy */
  idbOpen().then(function (db) {
    idbHandle = db;
    return Promise.all([idbGet('wall'), idbGet('me'), idbGet('contacts'), idbGet('emoji')]);
  }).then(function (res) {
    var applied = mediaApply({ wall: res[0], me: res[1], contacts: res[2], emoji: res[3] });
    var cur = mediaCollect();
    return Promise.all([
      idbPutVerified('wall', cur.wall),
      idbPutVerified('me', cur.me),
      idbPutVerified('contacts', cur.contacts),
      idbPutVerified('emoji', cur.emoji)
    ]).then(function (oks) {
      if (!oks.every(Boolean)) {
        /* 有任何一组没确认安全 → 整体不切，图继续留在存档里（失败保留） */
        idbNote = '图片存在 localStorage（搬家没成功，已保持原样）';
        if (done) done(false, applied);
        return;
      }
      mediaInIdb = true;
      idbNote = '图片存在 IndexedDB';
      saveNow();            /* 从这一次存档起，图不再进那 5MB 的 JSON（先写后删） */
      mediaSaveToIdb();
      if (done) done(true, applied);
    });
  }).catch(function () {
    mediaInIdb = false;     /* IDB 用不了：什么都不动，完全退回「图进存档」的行为 */
    idbNote = '图片存在 localStorage（本机 IndexedDB 不可用）';
    if (done) done(false, 0);
  });
}
/* 图写进 IDB（异步）。万一 IDB 忽然写不进去 → 切回「图进存档」并如实提示，绝不两边都没有 */
function mediaSaveToIdb() {
  if (!mediaInIdb || !idbHandle) return;
  var cur = mediaCollect();
  Promise.all([
    idbPutVerified('wall', cur.wall),
    idbPutVerified('me', cur.me),
    idbPutVerified('contacts', cur.contacts),
    idbPutVerified('emoji', cur.emoji)
  ]).then(function (oks) {
    if (oks.every(Boolean)) return;
    mediaInIdb = false;
    idbNote = '图片改回存在 localStorage（IndexedDB 写入失败）';
    if (typeof toast === 'function') toast('图片存储出了点问题，已改回原来的存法（图片没丢）');
    saveNow();
  }).catch(function () { /* 上面那支兜住；这里静默 */ });
}
/* 存档时把图摘出去（同一段同步代码里摘掉再原样还回内存，渲染不受影响）。
   ⚠️ 只有 mediaInIdb 为真才摘 —— 没搬家成功时一个字节都不动（失败保留）。
   接缝说明：本单的存档写在**冻结的** `lib/state.js` 里（`JSON.stringify(S)`），
   所以这里不包存档函数，而是给 S 装一个 `toJSON`：序列化时自动去掉图、内存里的 S 不变。
   `JSON.stringify` 会调用 `toJSON` 并用它的返回值替换整个对象，所以内存一侧零副作用。 */
function mediaStrippedCopy() {
  if (!mediaInIdb) return null;                  /* 没搬家成功 → 不摘（失败保留） */
  var out = {};
  Object.keys(S).forEach(function (k) { out[k] = S[k]; });
  out.walls = { home: '', chat: '' };
  out.annivBg = '';                              /* 第13单的卡片背景图也一起摘出去（同一条硬规则） */
  out.avatars = { me: '', ta: (S.avatars && S.avatars.ta) || '', taBy: {} };
  Object.keys((S.avatars && S.avatars.taBy) || {}).forEach(function (k) { out.avatars.taBy[k] = ''; });

/* ---------- 2. 基础工具 ---------- */
function $(id){ return document.getElementById(id); }
function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function qa(sel, root){ return $$(sel, root); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function pad2(n){ return (n < 10 ? '0' : '') + n; }
var _uidN = 0;
function uid(p){
  _uidN++;
  return (p || 'id') + Date.now().toString(36) + _uidN.toString(36) + Math.floor(1000 + Math.random() * 46000).toString(36);
}
function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a){ return a && a.length ? a[Math.floor(Math.random() * a.length)] : ''; }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function nowMin(){ var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function todayStr(ts){
  var d = ts ? new Date(ts) : new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function hm(ts){
  var d = ts ? new Date(ts) : new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function mdhm(ts){
  var d = new Date(ts), n = new Date();
  if (todayStr(ts) === todayStr()) return hm(ts);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm(ts);
}
function fmtY(n){ return (Math.round(Number(n) || 0) / 100).toFixed(2); }
function weekCn(ts){
  var w = '日一二三四五六';
  return '周' + w[new Date(ts || Date.now()).getDay()];
}
function fmtDur(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  if (sec < 60) return sec + ' 秒';
  if (sec < 3600) return Math.floor(sec / 60) + ' 分钟';
  return Math.floor(sec / 3600) + ' 小时 ' + Math.floor((sec % 3600) / 60) + ' 分';
}

/* ---------- 3. toast / 弹层 ---------- */
var _toastN = 0;
function toast(t){
  var L = $('toastLayer');
  if (!L) return;
  if (L.children.length >= 3) L.removeChild(L.firstChild);
  var d = document.createElement('div');
  d.className = 'toast';
  d.textContent = t;
  L.appendChild(d);
  _toastN++;
  setTimeout(function(){
    if (!d.parentNode) return;
    d.className = 'toast out';
    setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 340);
  }, 1700);
}
function openSheet(title, html, acts){
  var w = $('sheetWrap'), s = $('sheet');
  if (!w || !s) return;
  var a = '';
  if (acts && acts.length) {
    a = '<div class="sheet-acts">';
    acts.forEach(function(x, i){
      /* ⚠️ gid 也要透传：礼物库/红包的弹层按钮靠 data-gid 定位分类，漏了它 handler 会拿到 null */
      a += '<button class="btn ' + (x.kind || '') + '" data-act="' + esc(x.act || 'sheet-close') + '" data-id="' + esc(x.id || '') + '"'
        + (x.gid ? ' data-gid="' + esc(x.gid) + '"' : '') + '>' + esc(x.label) + '</button>';
    });
    a += '</div>';
  }
  s.innerHTML = '<div class="sheet-grip"></div>' + (title ? '<h3>' + esc(title) + '</h3>' : '') + (html || '') + a;
  s.scrollTop = 0;
  w.classList.add('on');
}
function closeSheet(){
  var w = $('sheetWrap');
  /* ⚠️ 关弹层的**唯一收口**：顺手把「编辑自定义卡」的草稿丢掉。
     放在这里（而不是只放在 sheet-close 动作里）是因为关弹层有三条路：
     ① 点遮罩（`.sheet-mask` 就是 data-act="sheet-close"）② 各 handler 里的 closeSheet()
     ③ Esc / 安卓返回键 —— 后两条根本不经过 sheet-close 动作。
     草稿留着不倒，下次编辑别的卡时可能被当成当前编辑对象写进存档。 */
  if (typeof RT !== 'undefined' && RT) RT.fcEdit = null;
  /* 第32单 美化：这里还要顺手**回滚气泡 CSS 的预览**。
     打字时是「只预览不落档」（直接改 #cssUser），所以草稿在飞的时候
     必须把 #cssUser 恢复成存档里的那一版 —— 否则取消/按返回键之后，
     屏幕上留着一段没保存的样式，用户以为已经生效了。 */
  if (typeof RT !== 'undefined' && RT && RT.skDraft !== null) {
    RT.skDraft = null;
    if (typeof paintSkin === 'function') paintSkin();
  }
  if (w) w.classList.remove('on');

/* 消息类型白名单。
   ⚠️ 第9单把表情统一成 'stk'（一条独立表情条）；'sticker'/'stkimg' 是旧档遗留，

   否则 normMsg 会把它降级成 'text'（表现是「发出去了但变成空气泡」）。
   新加类型一定要进这张表。 */
var T = ['text', 'card', 'stk', 'sticker', 'stkimg', 'image', 'voice', 'redpk', 'gift', 'call', 'shadow', 'sys', 'song'];

function normContact(c, i){
  c = c && typeof c === 'object' ? c : {};
  return {
    id: c.id || ('c' + (i + 1)),
    name: String(c.name || '梦角').slice(0, 12),
    av: String(c.av || '').slice(0, 400000),
    c: c.c || '#B78C85',
    role: String(c.role || '梦角'),
    on: c.on !== false,
    talk: Array.isArray(c.talk) ? c.talk.filter(function(x){ return typeof x === 'string'; }) : TALK_DEFAULT.slice(),
    post: Array.isArray(c.post) ? c.post : [],
    letter: Array.isArray(c.letter) ? c.letter : []
  };
}
function normMsg(m){
  m = m && typeof m === 'object' ? m : {};
  var o = {
    id: m.id || uid('m'),
    from: (m.from === 'me' || m.from === 'self') ? 'me' : (m.from === 'ta' || m.from === 'other' ? 'ta' : 'sys'),
    type: T.indexOf(m.type) >= 0 ? m.type : 'text',
    ts: Number(m.ts) || Date.now(),
    rd: !!m.rd,
    seen: !!m.seen
  };
  if (typeof m.text === 'string') o.text = m.text;
  /* 第22单 群聊：发言人 = 某位私聊成员的 cid。私聊消息没有这个字段。
     渲染群聊时用 spk 找成员的名字和头像，而不是整群的。 */
  if (m.spk) o.spk = String(m.spk).slice(0, 24);
  /* 第9单 表情包：stk 现在是「载荷对象」（{id,e,src,w,h,gid,gN}）。
     旧档里 stk 是一串颜文字字面量 —— 两种都要认，否则老档一升级表情就全丢。
     对象形态走 normStk 逐层重建；字符串形态包成纯文字载荷。 */
  if (m.stk && typeof m.stk === 'object') {
    var _sk = normStk(m.stk);
    if (_sk) o.stk = _sk;
  } else if (typeof m.stk === 'string' && m.stk) {
    var _sk2 = normStk({ id: '', e: m.stk, src: '', w: 0, h: 0 });
    if (_sk2) o.stk = _sk2;
  }
  /* 表情条（type='stk' / 'sticker'）没有载荷就是空气泡，直接丢弃；
     'stkimg' 是旧档里预留的图片表情类型，一并归到 'stk' 渲染 */
  if ((o.type === 'stk' || o.type === 'stkimg' || o.type === 'sticker') && !o.stk) return null;
  if (typeof m.img === 'string') o.img = m.img;
  if (m.shadowId) o.shadowId = String(m.shadowId);
  /* 第7单 红包卡：金额/留言/是否已拆/是否被退回/关联的流水 id
     —— 字段必须逐项兜底重建，漏一个幂等判据（opened）就再也不会成立 */
  if (m.redpk && typeof m.redpk === 'object') {
    o.redpk = {
      total: Math.max(0, Number(m.redpk.total) || 0),
      msg: String(m.redpk.msg == null ? '' : m.redpk.msg).slice(0, 60),
      opened: !!m.redpk.opened,
      returned: !!m.redpk.returned,
      rid: String(m.redpk.rid || '')
    };
  }
  /* 第8单 礼物卡：名称/图标/附言/礼物条目 id/是否已领取/TA 是否已反应 */

/* ---------- 5. 全局心跳（全站唯一 setInterval） ---------- */
var TASKS = [];
var HB = 0;
function registerTask(def){
  def.cd = def.cd || function(){ return rnd(def.min * 60000, def.max * 60000); };
  def.nextAt = Date.now() + def.cd();
  def.on = def.on || function(){ return true; };
  def.run = def.run || function(){};
  TASKS.push(def);
  return def;
}
function schedTick(){
  var now = Date.now();
  TASKS.forEach(function(t){
    var on = false;
    try { on = !!t.on(); } catch (e) { on = false; }
    if (!on) { if (now >= t.nextAt) t.nextAt = now + t.cd(); return; }
    if (now < t.nextAt) return;
    t.nextAt = now + t.cd();
    try { t.run(); } catch (e) { /* 单个任务异常不影响心跳 */ }
  });
}
function heartbeat(){
  HB++;
  var d = new Date();
  var st = $('sbTime');
  if (st) st.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  if (HB % 5 === 0) schedTick();
  if (HB % 20 === 0) { moRefresh(); moPaintClock(); }
  /* 第10单 语音通话：接通后每秒刷计时 + 中途挂断检查。
     不在通话中时 callTick 第一行就 return，等于零成本。 */
  callTick();
  /* 第19单 陪伴：每秒刷计时 / 到点进「时间到」/ 番茄分段切换 / TA 小概率离开。
     同样不在陪伴中时第一行就 return（陪伴模块**不许**自起 setInterval）。 */
  coTick();

   不挂 setInterval 的话 HB 恒为 1 → `HB % 5 === 0` 永不成立 → schedTick 永不执行
   → 所有 registerTask 的定时行为（主动聊天/碎影/写信/日记）全是死的。
   全站只此一处 setInterval，各模块一律不许再自起一个。 */
function startHeartbeat(){
  if (window.__hbTimer) return;
  window.__hbTimer = setInterval(heartbeat, 1000);

      var near = (now - (st.lastPerceive || 0)) < 30 * 60000;
      [['P', 'p'], ['A', 'a'], ['L', 'l']].forEach(function(pair){
        var K = pair[0], f = pair[1];
        if (!st[f] || !st['since' + K] || now - st['since' + K] >= (st['cd' + K] || 0)) {
          var bonus = (K === 'P' && near) ? MO.P.bonus : null;
          st[f] = MO[K].vals[moPickW(moWeights(K, h), bonus)].k;
          st['since' + K] = now;
          st['cd' + K] = rnd(MO[K].cd[0], MO[K].cd[1]) * 60000;
          dirty = true;
        }
      });
    });
  });
  if (dirty) save();
}
function moVal(K, k){
  var list = MO[K].vals;
  for (var i = 0; i < list.length; i++) if (list[i].k === k) return list[i];
  return { k: k || '', t: '未知' };
}
function moValIdx(K, k){
  var list = MO[K].vals;
  for (var i = 0; i < list.length; i++) if (list[i].k === k) return i;
  return 0;
}
function moPerceive(){
  var r = moCurRole();
  if (!r) { toast('还没有梦角'); return; }
  var mo = momentOf(S.cid);
  var st = mo.state[r.id];
  if (!st) return;
  var pi = moValIdx('P', st.p), ai = moValIdx('A', st.a), li = moValIdx('L', st.l);
  toast('「' + r.name + '」：' + MO.P.say[pi] + '，' + MO.A.say[ai] + '，' + MO.L.say[li] + '。');
  st.lastPerceive = Date.now();

}
function moPaintClock(){

  var r = moCurRole();
  if (!r) { el.textContent = '--:--'; return; }
  var m = Math.floor(moWorldMin(r));

}

/* ---------- 收发 ---------- */
function addMsg(cid, m){
  var o = normMsg(m);
  /* normMsg 会丢弃「没有载荷的表情条」；调用方拿 null 时不能往下走 */
  if (!o) return null;
  if (!S.msgs[cid]) S.msgs[cid] = [];
  S.msgs[cid].push(o);
  if (o.from === 'ta') {
    if (RT.route !== 'chat') { S.unread[cid] = unreadOf(cid) + 1; }
  }
  save();
  if (RT.route === 'chat') paintThread();
  else if (RT.route === 'chatlist') paintChatList();
  else if (RT.route === 'home') paintHome();
  return o;
}
function markSeen(cid){
  var list = S.msgs[cid] || [], ch = false;
  list.forEach(function(m){ if (m.from === 'me' && !m.seen) { m.seen = true; ch = true; } });
  if (ch) {
    save();
    if (RT.route === 'chat') {
      $$('.meta').forEach(function(el){
        var id = el.getAttribute('data-meta');
        for (var i = 0; i < list.length; i++) if (list[i].id === id) { el.textContent = list[i].seen ? '已读' : '送达'; break; }
      });
    }
  }
}
function setTyping(on){
  RT.typing = !!on;
  if (RT.route === 'chat') paintThread();
}
function taReplyOnce(cid){
  /* 第22单：回复发给谁，就用谁的专属卡池（公共 ∪ 该联系人专属），绝不串卡。
     群聊：从成员里挑一位出来说话，用 TA 的名字头像和卡池。 */
  var g = isGroupChat(cid) ? groupById(cid) : null;
  var spkId = '';
  if (g) {
    var mems = (g.members || []).filter(function(x){ return contactById(x); });
    if (!mems.length) mems = S.contacts.map(function(c){ return c.id; });
    spkId = pick(mems);
  }
  var who = spkId || cid;
  if (!contactById(who)) who = S.cid;
  var c = contactById(who);
  var card = drawCardFor(who);
  var type = 'text', text = '';
  if (card && Math.random() * 100 < S.settings.cardReplyP) { type = 'card'; text = card.text; }
  else if (card) { type = 'text'; text = card.text; }
  else { text = pick(c.talk && c.talk.length ? c.talk : TALK_DEFAULT); }
  if (!text) text = '嗯，我在的。';
  var payload = { from: 'ta', type: type, text: text };
  if (g) payload.spk = who;
  var m = addMsg(g ? g.id : cid, payload);
  /* 第9单 表情包：回复完之后再掷一次「甩表情」。
     传 m.id 进去 —— 命中且走混条分支时，表情会挂到刚才那条消息上同条发出；
     走单独分支则新起一条表情条。没有文字消息可挂（m 为 null）时只会单独发。 */
  maybeTaSticker(m ? m.id : null);
  return m;
}
/* 群聊发言人取名字头像：有 spk 用成员，否则当前联系人 */
function msgFrom(m){
  if (m.spk) { var sp = contactById(m.spk); if (sp) return sp; }
  return ta();
}
function scheduleReply(cid){
  cid = cid || S.cid;
  var nm = chatName(cid);
  var readAt = rnd(500, 1400);
  var delay = rnd(S.settings.replyMin * 1000, S.settings.replyMax * 1000);
  var noReply = Math.random() * 100 < S.settings.readNoP;
  setTimeout(function(){
    markSeen(cid);
    if (RT.route === 'chat') setTyping(false);
  }, readAt);
  setTimeout(function(){
    markSeen(cid);
    if (noReply) { toast(nm + ' 已读，但没有回你'); return; }
    setTyping(true);
    setTimeout(function(){ setTyping(false); taReplyOnce(cid); }, rnd(800, 1800));
  }, readAt + delay);
}
function sendText(){
  var el = $('chatInput');
  if (!el) return;
  var v = String(el.value || '').replace(/\s+$/, '');
  if (!v) return;
  el.value = '';
  autoGrow(el);
  closePanel();
  addMsg(S.cid, { from: 'me', type: 'text', text: v });
  scheduleReply(S.cid);
}

  /* 旧入口（字符串颜文字）保留兼容；新代码请用 39_stk.js 的 sendStickerItem */
  closePanel();
  addMsg(S.cid, { from: 'me', type: 'stk', text: '', stk: { id: '', e: String(s || ''), src: '', w: 0, h: 0, gid: '', gN: '' } });
  scheduleReply(S.cid);
}
function poke(who){
  var c = C();

  if (who === 'me') {
    addMsg(S.cid, { from: 'sys', type: 'sys', text: '我 拍了拍 ' + c.name + ' · ' + act });
    if (Math.random() < 0.7) {

      }, rnd(700, 1800));

/* ---------- 输入条与共用面板 ---------- */
function autoGrow(el){

/* ==========================================================
   30_cardlib.js · 字卡库（TA 的回复语料库）+ 拍一拍动作池

var UNCAT = '未分组';
function scopeName(sc){
  if (sc === 'public') return '公共字卡';
  var c = null;
  S.contacts.forEach(function(x){ if (x.id === sc) c = x; });
  return (c ? c.name : '梦角') + '专属字卡';
}
function groupsOf(sc){ return (S.cardLib.groups || []).filter(function(g){ return g.scope === sc; }); }
function ensureUncat(sc){
  var hit = null;
  (S.cardLib.groups || []).forEach(function(g){ if (g.scope === sc && g.name === UNCAT) hit = g; });
  if (!hit) {
    hit = { id: uid('g'), name: UNCAT, scope: sc, hidden: false, items: [] };
    S.cardLib.groups.push(hit);
  }
  return hit;
}
function findGroup(gid){
  var out = null;
  (S.cardLib.groups || []).forEach(function(g){ if (g.id === gid) out = g; });
  return out;
}
function findCard(cid){
  var out = null;
  (S.cardLib.groups || []).forEach(function(g){
    g.items.forEach(function(it, i){ if (it.id === cid) out = { g: g, it: it, i: i }; });
  });
  return out;
}
function scopeOptions(sel){
  var h = '<option value="public"' + (sel === 'public' ? ' selected' : '') + '>公共字卡 · ' + UNCAT + '</option>';
  groupsOf('public').forEach(function(g){
    if (g.name === UNCAT) return;
    h += '<option value="' + esc(g.id) + '"' + (sel === g.id ? ' selected' : '') + '>公共字卡 · ' + esc(g.name) + '</option>';
  });
  S.contacts.forEach(function(c){
    groupsOf(c.id).forEach(function(g){
      h += '<option value="' + esc(g.id) + '"' + (sel === g.id ? ' selected' : '') + '>' + esc(c.name) + '专属 · ' + esc(g.name) + '</option>';
    });
  });
  return h;
}
function targetByKey(k){
  if (!k || k === 'public') return ensureUncat('public');
  var g = findGroup(k);
  return g || ensureUncat('public');
}

  var box = $('libBody');

    + '<button class="btn" data-act="lib-export">' + ico('down') + '导出</button>'
    + '<button class="btn" data-act="lib-import">' + ico('up') + '导入</button>'
    + '</div>';

  if (q) {
    var hits = [];
    groupsOf(sc).forEach(function(g){
      g.items.forEach(function(it){ if (it.text.toLowerCase().indexOf(q) >= 0) hits.push({ g: g, it: it }); });
    });
    h += '<div class="card">';
    if (!hits.length) h += '<div class="empty">没有找到</div>';
    else h += hits.map(function(x){

      h += '<div class="card"><div class="empty">' + ico('cards') + '<br>这个范围还是空的<br>点「新增字卡」或「批量添加」把 TA 的回复存进来</div></div>';
