          + '<button class="btn sm" data-act="lib-ghide" data-id="' + esc(g.id) + '" aria-label="隐藏或显示">' + ico(g.hidden ? 'eyeoff' : 'eye') + '</button> '
          + (g.name === UNCAT ? '' : '<button class="btn sm" data-act="lib-gren" data-id="' + esc(g.id) + '" aria-label="重命名">' + ico('pencil') + '</button> ')
          + (g.name === UNCAT ? '' : '<button class="btn sm danger" data-act="lib-gdel" data-id="' + esc(g.id) + '" aria-label="删除分组">' + ico('trash') + '</button>')
          + '</span></div>';
        if (!g.items.length) h += '<div class="li-s" style="padding:6px 2px 10px">还没有字卡</div>';
        else h += g.items.map(function(it){
          return '<div class="li"><span class="li-t">' + esc(it.text) + '</span>'
            + '<button class="btn sm" data-act="lib-edit" data-id="' + esc(it.id) + '" aria-label="编辑">' + ico('pencil') + '</button>'
            + '<button class="btn sm danger" data-act="lib-del" data-id="' + esc(it.id) + '" aria-label="删除">' + ico('close') + '</button></div>';
        }).join('');
        h += '</div>';
      });
    }
  }

  h += '<div class="sechd"><h3>拍一拍动作池</h3><span id="pokeStat">' + S.pokes.length + ' 条</span></div>';
  h += '<div class="card"><div class="li-s" style="padding:0 0 8px">双击头像时用的语句，TA 也会从这里挑。</div>';
  h += S.pokes.map(function(p, i){
    return '<div class="li"><span class="li-t">' + esc(p) + '</span>'
      + '<button class="btn sm danger" data-act="poke-del" data-id="' + i + '" aria-label="删除">' + ico('close') + '</button></div>';
  }).join('');
  h += '<div style="display:flex;gap:8px;margin-top:10px"><input class="inp" id="pokeNew" placeholder="加一条，如：捏了捏你的脸">'

  h += '<div class="soon-note">隐藏的分组不参与 TA 抽卡；字卡库为空时 TA 会用自带的语料兜底。</div>';
  box.innerHTML = h;
}

  target.items.push({ id: uid('k'), text: t });
  save(); closeSheet(); paintCards(); toast('已加入「' + target.name + '」');
}
function batchDo(){
  var raw = ($('libBatch') || {}).value || '';
  var target = targetByKey(($('libGroupSel') || {}).value);
  var lines = String(raw).split(/\r?\n/).map(function(s){ return s.trim(); }).filter(function(s){ return !!s; });
  if (!lines.length) { toast('一行都没填'); return; }
  var have = {};
  target.items.forEach(function(it){ have[it.text] = 1; });
  var added = 0;
  lines.forEach(function(t){
    if (have[t]) return;
    have[t] = 1;
    target.items.push({ id: uid('k'), text: t });
    added++;
  });
  save(); closeSheet(); paintCards();
  toast(added ? ('成功添加 ' + added + ' 条到「' + target.name + '」') : '内容都已存在，没有新增');

/* ---------- 导入 / 导出 ---------- */
/* 【壳内导出·必须走桥底层】⚠️ 手册 12.4 实测：静态站（无打包器）里 Capacitor 的 Plugins 表**恒为空** ——
   @capacitor/android 的 native-bridge.js 只**读**那张表、从不填充它（L256/273/293/835），
   于是 Plugins.Share 永远 undefined，整块导出会静默回落到被安卓 WebView 忽略的
   <a download>，表现就是「点了导出没反应」。唯一可行的调用是桥的底层
   Capacitor.nativePromise(插件名, 方法名, 参数)（定义在同文件 L999、L1013 挂到 window.Capacitor）。
   ⚠️ 这两个 helper 故意放在 downloadJson **之外**（别塞进被静态判据切片扫描的函数体）。
   ⚠️ 此处刻意不写出那个点号全名：写进注释会让静态判据把它当成「还留着死路」而假红
      （手册 12.4 末段，客单17 实测踩过）。 */
function inAppShell(){
  var C = window.Capacitor;
  return !!(C && typeof C.nativePromise === 'function'
            && (typeof C.isNativePlatform !== 'function' || C.isNativePlatform()));
}
function nativeExportJson(filename, txt){
  var C = window.Capacitor;
  return C.nativePromise('Filesystem', 'writeFile',
      { path: filename, data: txt, directory: 'CACHE', encoding: 'utf8', recursive: true })
    .then(function(res){
      var uri = (res && res.uri) ? res.uri : '';
      if (!uri) throw new Error('没拿到文件 URI');
      /* ⚠️ 只给 url，别同时给 files —— 手册 13.4 第 2 条：url 与 files 同时给会让 shareFiles
         被调两次、EXTRA_STREAM 重复，接收方看到重复附件。给一个就好。 */
      return C.nativePromise('Share', 'share',
        { title: filename, text: '数据备份', url: uri, dialogTitle: '导出数据' });
    });
}
function downloadJson(filename, data, doneMsg){
  var txt = JSON.stringify(data, null, 2);
  if (inAppShell()) {
    /* 壳内：写 CACHE 目录（正好被 file_paths.xml 的 <cache-path path="."/> 覆盖）→
       拿 file:// URI → 系统分享面板。失败要**吵**，别静默（手册第二节续）。 */
    nativeExportJson(filename, txt)
      .then(function(){ toast(doneMsg || '已导出'); })
      .catch(function(e){ toast('导出失败：' + ((e && e.message) || '未知错误')); });
    return;
  }
  try {
    var blob = new Blob([txt], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 1500);
    toast(doneMsg || '已导出');
    return;
  } catch (e2) { /* 落到分享 */ }
  try {

}
function exportCards(){

    cardLib: S.cardLib, pokes: S.pokes

function importFileInto(text){
  var d = null;
  try { d = JSON.parse(text); } catch (e) { toast('这不是有效的 JSON 文件，请检查后重试'); return; }
  if (!d || typeof d !== 'object') { toast('文件内容不是一个 JSON 对象'); return; }
  var found = { flat: [], groups: [], pokes: [] };
  if (d.site === 'mj19' && d.cardLib) {
    (d.cardLib.groups || []).forEach(function(g){
      found.groups.push({ name: String(g.name || UNCAT), hidden: !!g.hidden, scope: g.scope, items: (g.items || []).map(function(x){ return typeof x === 'string' ? x : (x && x.text) || ''; }).filter(Boolean) });
    });
    if (Array.isArray(d.pokes)) found.pokes = found.pokes.concat(d.pokes.filter(function(x){ return typeof x === 'string'; }));
  }
  scanBackup(d, found, 0);
  if (!found.flat.length && !found.groups.length && !found.pokes.length) {
    toast('没有认出可导入的字卡或拍一拍（本页只认字卡与拍一拍）');
    return;
  }
  var sc = RT.libScope;
  var inGroups = {};
  var gAdded = 0, cAdded = 0, pAdded = 0;
  var nameMap = {};
  groupsOf(sc).forEach(function(g){ nameMap[g.name] = g; });
  found.groups.forEach(function(sg){
    var src = (sg.items || []).filter(Boolean);
    src.forEach(function(t){ inGroups[t] = 1; });
    if (!src.length) return;
    var g = nameMap[sg.name];
    if (!g) {
      g = { id: uid('g'), name: sg.name, scope: sc, hidden: !!sg.hidden, items: [] };
      S.cardLib.groups.push(g);
      nameMap[sg.name] = g;
      gAdded++;
    }
    var have = {};
    g.items.forEach(function(it){ have[it.text] = 1; });
    src.forEach(function(t){
      if (have[t]) return;
      have[t] = 1;
      g.items.push({ id: uid('k'), text: t });
      cAdded++;
    });
  });
  var un = ensureUncat(sc);
  var haveU = {};
  un.items.forEach(function(it){ haveU[it.text] = 1; });
  found.flat.forEach(function(t){
    if (inGroups[t] || haveU[t]) return;
    haveU[t] = 1;
    un.items.push({ id: uid('k'), text: t });
    cAdded++;
  });
  found.pokes.forEach(function(p){
    if (S.pokes.indexOf(p) < 0) { S.pokes.push(p); pAdded++; }
  });
  save();
  if (RT.route === 'cards') paintCards();
  if (!cAdded && !pAdded) toast('内容已全部存在（去重生效），没有新增');
  else toast('导入 ' + cAdded + ' 张字卡 / ' + gAdded + ' 个分组 / ' + pAdded + ' 条拍一拍');
}
function scanBackup(node, found, depth){
  if (node == null || depth > 8) return;
  if (typeof node === 'string') {
    var s = node.trim();
    if (s.charAt(0) === '[' || s.charAt(0) === '{') { try { scanBackup(JSON.parse(s), found, depth + 1); } catch (e) {} }
    return;
  }
  if (Array.isArray(node)) { node.forEach(function(x){ scanBackup(x, found, depth + 1); }); return; }
  if (typeof node !== 'object') return;
  Object.keys(node).forEach(function(k){
    var v = node[k], lk = k.toLowerCase();
    if (/customreplies$/.test(lk)) { collectReplyList(v, found); return; }
    if (/customreplygroups$/.test(lk)) { collectReplyGroups(v, found); return; }
    if (/custompoke(groups|s)?$/.test(lk)) { collectPokeList(v, found); return; }
    if (/^(cardlib|groups|items|replies|cards)$/.test(lk)) { return; }
    scanBackup(v, found, depth + 1);
  });
}
function asParsed(v){
  if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return null; } }
  return v;
}
function collectReplyList(v, found){
  var a = asParsed(v);
  if (!a) return;
  if (Array.isArray(a)) {
    a.forEach(function(x){
      if (typeof x === 'string' && x.trim()) found.flat.push(x.trim());
      else if (x && typeof x === 'object' && typeof x.text === 'string' && x.text.trim()) found.flat.push(x.text.trim());
    });
    return;
  }
  if (typeof a === 'object' && Array.isArray(a.items)) collectReplyList(a.items, found);
}
function collectReplyGroups(v, found){
  var a = asParsed(v);
  if (!Array.isArray(a)) return;
  a.forEach(function(g){
    if (!g || typeof g !== 'object') return;
    var items = Array.isArray(g.items)
      ? g.items.map(function(x){ return typeof x === 'string' ? x.trim() : (x && x.text ? String(x.text).trim() : ''); }).filter(Boolean)
      : [];
    if (items.length) found.groups.push({ name: String(g.name || UNCAT), hidden: !!g.disabled || !!g.hidden, items: items });
  });
}
function collectPokeList(v, found){
  var a = asParsed(v);
  if (!a) return;
  if (Array.isArray(a)) {
    a.forEach(function(x){
      if (typeof x === 'string' && x.trim()) found.pokes.push(x.trim());
      else if (x && typeof x === 'object' && Array.isArray(x.items)) collectPokeList(x.items, found);
    });
    return;
  }
  if (typeof a === 'object' && Array.isArray(a.items)) collectPokeList(a.items, found);
}

/* ---------- 1. 当天庆祝文案池（≥5 条；种子 6 条，可编辑） ---------- */
function seedAnnivLines(){
  return [
    '今天是个重要的日子，我记得的',
    '纪念日快乐呀，我们走了这么久',
    '这一天的意义，是因为有你',
    '想了想还是想跟你说一声：今天特别',
    '把今天记下来，明年还要一起过',
    '又走到这一天了，真好'
  ];
}

/* ---------- 2. 归一化：日期必须真实存在、类型只认三种、坏档丢坏留好 ---------- */
var ANNIV_TYPES = ['together', 'countdown', 'yearly'];
var ANNIV_TYPE_LABEL = { together: '一起多少天', countdown: '倒数多少天', yearly: '每年循环' };

function normAnnivDate(v){
  var s = String(v == null ? '' : v).trim().slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return '';
  var y = parseInt(s.slice(0, 4), 10), m = parseInt(s.slice(5, 7), 10), d = parseInt(s.slice(8, 10), 10);
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return '';
  var dt = new Date(y, m - 1, d);
  /* 2026-02-30 这类「格式对但日子不存在」的，new Date 会溢出到 3 月 —— 回读校验挡掉 */
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return '';
  return s;
}
function normAnniv(arr){
  var out = [], seen = {};
  if (!Array.isArray(arr)) return out;
  for (var i = 0; i < arr.length; i++){
    var a = arr[i];
    if (!a || typeof a !== 'object') continue;
    var name = String(a.name == null ? '' : a.name).trim().slice(0, 24);
    var date = normAnnivDate(a.date);
    if (!name || !date) continue;
    var key = name + '|' + date;
    if (seen[key]) continue;                    /* 同名同日只留一条 */
    seen[key] = 1;
    var ts = Number(a.ts);
    out.push({
      id: String(a.id == null ? '' : a.id).trim().slice(0, 40) || uid('an'),
      name: name,
      date: date,
      type: ANNIV_TYPES.indexOf(a.type) >= 0 ? a.type : 'together',
      ts: (isFinite(ts) && ts > 0) ? ts : Date.now()
    });
    if (out.length >= 100) break;
  }
  return out;
}
function normAnnivLines(arr){
  var out = [];
  if (Array.isArray(arr)){
    for (var i = 0; i < arr.length; i++){
      var s = String(arr[i] == null ? '' : arr[i]).trim();
      if (s) out.push(s.slice(0, 120));
      if (out.length >= 60) break;
    }
  }
  return out.length ? out : seedAnnivLines();
}

/* ---------- 3. 天数：一律按自然日 ---------- */
function dayStart(t){
  var d = new Date(t);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}
function dayDiff(fromKey, toKey){
  /* 用 T12:00:00 而不是 T00:00:00：某些时区下零点会落进前一天，午间最稳 */
  var a = dayStart(new Date(fromKey + 'T12:00:00').getTime());
  var b = dayStart(new Date(toKey + 'T12:00:00').getTime());
  return Math.round((b - a) / 86400000);
}
/* 某条纪念日在「今天」的读数：{ label, days, today } —— 纯函数，便于单独断言 */
function annivCalc(a, today){
  var k = today || todayStr();
  var days = 0, label = '', isToday = false;
  if (!a || !a.date) return { label: '', days: 0, today: false };
  if (a.type === 'together'){
    days = dayDiff(a.date, k);
    if (days >= 0){ label = '已经一起 ' + days + ' 天'; isToday = (days === 0); }
    else { label = '还有 ' + (-days) + ' 天开始'; }
  } else if (a.type === 'countdown'){
    days = dayDiff(k, a.date);
    if (days > 0) label = '还有 ' + days + ' 天';
    else if (days === 0){ label = '就是今天'; isToday = true; }
    else label = '已过去 ' + (-days) + ' 天';
  } else {                                   /* yearly：每年循环（生日这类） */
    var mmdd = a.date.slice(5);
    var y = parseInt(k.slice(0, 4), 10);
    var next = y + '-' + mmdd;
    if (dayDiff(k, next) < 0) next = (y + 1) + '-' + mmdd;   /* 今年已过 → 看明年 */
    days = dayDiff(k, next);
    if (days === 0){ label = '就是今天'; isToday = true; }
    else label = '还有 ' + days + ' 天';
  }
  return { label: label, days: days, today: isToday };
}
/* 今天是哪几条纪念日 */
function annivTodayKeys(k){
  var key = k || todayStr();
  return (S.anniv || []).filter(function(a){ return annivCalc(a, key).today; });
}
function findAnniv(id){
  var list = S.anniv || [];
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}
/* 列表排序：今天最前 → 按「离今天多近」→ 名字 */
function annivSorted(k){
  var key = k || todayStr();
  return (S.anniv || []).slice().sort(function(x, y){
    var cx = annivCalc(x, key), cy = annivCalc(y, key);
    if (cx.today !== cy.today) return cx.today ? -1 : 1;
    var dx = Math.abs(cx.days), dy = Math.abs(cy.days);
    if (dx !== dy) return dx - dy;
    return String(x.name).localeCompare(String(y.name));
  });
}
/* 搜索过滤（硬规则2）：名字 / 日期 / 类型名 / 算出来的天数文案 都能搜到 */
function annivFiltered(){
  var q = String(RT.annivQ || '').trim().toLowerCase();
  var list = annivSorted();
  if (!q) return list;
  return list.filter(function(a){
    var c = annivCalc(a);
    return String(a.name).toLowerCase().indexOf(q) >= 0 ||
      a.date.indexOf(q) >= 0 ||
      (ANNIV_TYPE_LABEL[a.type] || '').toLowerCase().indexOf(q) >= 0 ||
      c.label.toLowerCase().indexOf(q) >= 0;
  });
}

   调度归属：TA 自动来信由 10_core 的唯一心跳 registerTask 驱动，

/* 抽卡拼接一封回信/来信的正文：从字卡库随机抽 5~10 张（去重），
   字卡库为空时兜底固定语料。标题单独抽一张字卡（或兜底标题池）。 */
var LETTER_MIN_CARDS = 5;
var LETTER_MAX_CARDS = 10;

function letterDrawBody(cid){
  /* 第22单：卡池 = 公共 ∪ 该联系人专属；绝不混进其他梦角的专属卡 */
  var cid2 = contactById(cid) ? cid : S.cid;
  var pool = [], seenP = {};
  libVisibleItems('public').concat(libVisibleItems(cid2)).forEach(function(it){
    if (it && it.id && !seenP[it.id]) { seenP[it.id] = true; pool.push(it); }
  });
  if (!pool.length) {
    /* 空库兜底：默认语料里随机挑 4~6 句拼成一段，读起来也是一封信 */
    var out = [];
    var n = rnd(4, 6);
    var used = {};
    for (var i = 0; i < n; i++) {
      var s = pick(LETTER_BODY_DEFAULT);
      if (used[s]) { i--; if (i > 40) break; continue; }
      used[s] = true;
      out.push(s);
    }
    out.push(pick(LETTER_TAIL_DEFAULT));
    return { text: out.join('\n'), cards: [] };
  }
  var want = rnd(LETTER_MIN_CARDS, LETTER_MAX_CARDS);
  if (want > pool.length) want = pool.length;
  var picked = [], seen = {};
  for (var j = 0; j < want; j++) {
    var it = pick(pool);
    if (!it || seen[it.id]) { j--; if (j > 80) break; continue; }
    seen[it.id] = true;
    picked.push(it);
  }
  var lines = picked.map(function(c){ return c.text; });
  lines.push(pick(LETTER_TAIL_DEFAULT));
  return { text: lines.join('\n'), cards: picked };
}
/* 标题：优先抽一张短字卡（公共 ∪ 该联系人专属），其次兜底标题池 */
function letterDrawTitle(cid){
  var cid2 = contactById(cid) ? cid : S.cid;
  var pool = libVisibleItems('public').concat(libVisibleItems(cid2)).filter(function(x){ return x.text && x.text.length <= 24; });
  if (pool.length) return pick(pool).text.slice(0, 40);
  return pick(LETTER_TITLE_DEFAULT);
}
/* 去信标题自动生成（Re: 逻辑）：首封信用「你好」，之后在上一封标题前加 Re: */
function autoLetterTitle(cid){
  var outs = lettersOf(cid).filter(function(l){ return l.dir === 'out'; });
  if (!outs.length) return pick(['你好', '写给你', '第一封信']);
  var last = outs[outs.length - 1];
  var base = String(last.title || '').replace(/^(Re:\s*)+/i, '').trim();
  return ('Re: ' + (base || '你好')).slice(0, 40);
}

    id: uid('let'),

    body: body.text,
    cards: body.cards,
    srcId: mode === 'reply' ? String(srcId || '') : '',
    unread: true,

/* ===== 43_contacts.js ===== */
/* ==========================================================
   43_contacts.js · 第22单 多联系人 + 群聊
   ----------------------------------------------------------
   工单依据：
   · 第22单 A 数据主键/迁移/删除 —— 唯一主键是稳定 cid，
     删除联系人只清该 cid 的数据，至少保留一位私聊联系人。
   · 第22单 B 页面与内容隔离 —— 各功能按 cid 过滤。
   · 第2单附加规范 —— 专属字卡 scope=<privateContactId>，
     群聊不建专属范围、群聊按「实际发言成员的 cid」取卡池。
   · 群聊不是一个梦角，不建立独立梦角数据空间（第22单前置）。

   ⚠️ 本分片排在 40_act 之前；所有函数声明会被提升，
   normS 里可以安全调用这里的 migrateMultiContact()。
   ========================================================== */

/* ---------- 1. 群聊实体 ---------- */

/* ⚠️ 归一化期间**不能**用 contactById()：那个函数读的是全局 S，而 load() 里
   `S = normS(raw)` 还没赋值完，全局 S 仍是 null（新开页面时就是 null）→ 整个启动会崩在
   `S.contacts` 上（「刷新一次页面直接白屏」）。所以这里收一个「合法联系人 id 集合」参数：
   归一化时由调用方传进来，运行时（新建/编辑群聊）不传才回落到全局查。 */
function normGroupChat(g, validIds){
  g = g && typeof g === 'object' ? g : {};
  var members = Array.isArray(g.members)
    ? g.members.map(function(x){ return String(x || ''); }).filter(function(x){ return x; })
    : [];
  function isContact(id){
    if (validIds) return validIds.indexOf(id) >= 0;
    return !!contactById(id);
  }
  /* 成员必须真实存在且是私聊联系人（群成员不能是另一个群） */
  var ok = [];
  members.forEach(function(id){
    if (isContact(id) && ok.indexOf(id) < 0) ok.push(id);
  });
  if (!ok.length) ok.push(validIds && validIds.length ? validIds[0] : 'c1');
  return {
    id: String(g.id || uid('grp')),
    name: String(g.name == null ? '' : g.name).trim().slice(0, 20) || '新群聊',
    av: String(g.av || '').slice(0, 400000),
    c: g.c || '#8FA9C7',
    members: ok,
    created: Number(g.created) || Date.now()
  };
}
function normGroups(raw, validIds){
  if (!Array.isArray(raw)) return [];
  var out = [];
  raw.forEach(function(x){
    if (!x || typeof x !== 'object') return;
    out.push(normGroupChat(x, validIds));
  });
  return out;
}

/* ---------- 2. 统一取聊天对象（联系人 or 群聊） ---------- */

function contactById(id){
  id = String(id || '');
  for (var i = 0; i < S.contacts.length; i++) if (S.contacts[i].id === id) return S.contacts[i];
  return null;
}
function groupById(id){
  id = String(id || '');
  for (var i = 0; i < (S.groups || []).length; i++) if (S.groups[i].id === id) return S.groups[i];
  return null;
}
function isGroupChat(id){ return !!groupById(id); }
function privateContacts(){
  return S.contacts.filter(function(c){ return c.id !== 'me'; });
}
/* 某个聊天 id 的展示信息（名字 / 头像 / 首字 / 主题色）。
   群聊头像：有自定义图用图，没有就用成员首字拼的占位。 */
function chatInfo(id){
  var g = groupById(id);
  if (g) {
    return { kind: 'group', id: g.id, name: g.name, av: g.av, ch: g.name.slice(0, 1), c: g.c, obj: g };
  }
  var c = contactById(id);
  if (c) return { kind: 'contact', id: c.id, name: c.name, av: c.av, ch: c.name.slice(0, 1), c: c.c, obj: c };
  /* 找不到（旧档/已删）—— 回落第一位联系人，但**不**改写传入 id */
  var f = S.contacts[0];
  return { kind: 'contact', id: f.id, name: f.name, av: f.av, ch: f.name.slice(0, 1), c: f.c, obj: f, ghost: true };
}
function chatName(id){ return chatInfo(id).name; }

/* ---------- 3. 按 cid 的数据访问器（其余分片统一走这里） ---------- */

function cidKey(cid){ return String(cid || S.cid || 'c1'); }

/* 头像（第22单·一键换梦角）：我的头像全局一份，TA 的头像按 cid 各存一份。
   读不到就回落空串 —— 调用点再依次回落 c.av（内置底色/首字）→ 首字母。 */
function taAv(cid){
  cid = cid || S.cid;
  var m = S.avatars && S.avatars.taBy;
  return (m && m[cid]) ? m[cid] : '';
}
function setTaAv(cid, d){
  if (!S.avatars || typeof S.avatars !== 'object') S.avatars = { me: '', ta: '', taBy: {} };
  if (!S.avatars.taBy || typeof S.avatars.taBy !== 'object') S.avatars.taBy = {};
  cid = cid || S.cid;
  if (d) S.avatars.taBy[cid] = String(d); else delete S.avatars.taBy[cid];
}

/* 一键换梦角：只挪「当前身份」S.cid，各功能数据本来就按 cid 分桶 ——
   这里**不搬不删**，只把各页的临时选择一起对齐，免得停在旧梦角的选择上。 */
function switchCid(cid){
  if (!contactById(cid)) return false;
  if (cid === S.cid) return false;
  S.cid = cid;
  /* 各功能页的临时选择一起对齐到新梦角，免得停在旧梦角的选择上
     （碎影/通话筛选的「全部」是用户显式选的汇总视图，这里也归零回到单人视图） */
  RT.checkinCid = cid; RT.diaryCid = cid; RT.rpCid = cid; RT.gfCid = cid;
  RT.shadowCid = cid; RT.callLogCid = cid; RT.ltCid = cid;
  saveNow();
  /* 首页（桌面上的人/状态/字卡）＋ 当前屏都要重画 */
  paint();
  paintHome();
  return true;
}

/* 红包：S.rp = { <cid>: {records, pending} } */
function normRpBucket(b){
  b = b && typeof b === 'object' ? b : {};
  return { records: normRpRecs(b.records), pending: normRpPending(b.pending) };
}
function rpOf(cid){
  var k = cidKey(cid);
  if (!S.rp || typeof S.rp !== 'object') S.rp = {};
  if (!S.rp[k] || typeof S.rp[k] !== 'object') S.rp[k] = { records: [], pending: [] };
  if (!Array.isArray(S.rp[k].records)) S.rp[k].records = [];
  if (!Array.isArray(S.rp[k].pending)) S.rp[k].pending = [];
  return S.rp[k];
}
/* 礼物流水：S.gifts 每条带 cid */
function giftsOf(cid){
  var k = cidKey(cid);
  return (S.gifts || []).filter(function(g){ return (g.cid || 'c1') === k; });
}
/* 打卡：S.locs = { <cid>: {mine,tas,taPlaces,history} } */
function locsOf(cid){
  var k = cidKey(cid);
  if (!S.locs || typeof S.locs !== 'object') S.locs = {};
  if (!S.locs[k] || typeof S.locs[k] !== 'object') {
    S.locs[k] = { mine: null, tas: null, taPlaces: CHECKIN_PLACES_DEFAULT.map(normLocPlace), history: [] };
  }
  var b = S.locs[k];
  if (!Array.isArray(b.taPlaces)) b.taPlaces = CHECKIN_PLACES_DEFAULT.map(normLocPlace);
  if (!Array.isArray(b.history)) b.history = [];
  return b;
}
/* 朋友圈：S.moment = { <cid>: {roster,state,seed} } */
function momentOf(cid){
  var k = cidKey(cid);
  if (!S.moment || typeof S.moment !== 'object') S.moment = {};
  if (!S.moment[k] || typeof S.moment[k] !== 'object') S.moment[k] = { roster: [], state: {}, seed: false };
  return S.moment[k];
}
/* TA 的钱包：S.wallet.ta = { <cid>: 金额 }（我的钱包是全局一份） */
function walletTa(cid){
  var k = cidKey(cid);
  if (!S.wallet || typeof S.wallet !== 'object') S.wallet = { me: 1314, ta: {} };
  if (!S.wallet.ta || typeof S.wallet.ta !== 'object') S.wallet.ta = {};
  var v = Number(S.wallet.ta[k]);
  if (!isFinite(v)) v = 520;
  S.wallet.ta[k] = Math.max(0, Math.round(v * 100) / 100);
  return S.wallet.ta[k];
}
/* 角标 seenAt：S.seen = { letter:{cid}, diary:{cid}, checkin:{cid}, rp:{cid}, gift:{cid} } */
function seenOf(kind, cid){
  var k = cidKey(cid);
  if (!S.seen || typeof S.seen !== 'object') S.seen = {};
  if (!S.seen[kind] || typeof S.seen[kind] !== 'object') S.seen[kind] = {};
  var v = Number(S.seen[kind][k]);
  if (!isFinite(v)) v = Date.now();            /* 新联系人：从现在起算，不把历史全标成未读 */
  return v;
}
function seenSet(kind, cid, ts){
  var k = cidKey(cid);
  if (!S.seen || typeof S.seen !== 'object') S.seen = {};
  if (!S.seen[kind] || typeof S.seen[kind] !== 'object') S.seen[kind] = {};
  S.seen[kind][k] = Number(ts) || Date.now();
  save();
}

/* ---------- 4. 旧档迁移（第22单 A.2：缺 cid 的历史全部归原默认梦角） ---------- */

function migrateMultiContact(raw, s){
  var dft = 'c1';
  if (raw && typeof raw === 'object') {
    /* 旧档里 contacts[0].id 若不是 c1，就以它为默认（老档唯一联系人） */
    if (Array.isArray(raw.contacts) && raw.contacts[0] && raw.contacts[0].id) dft = String(raw.contacts[0].id);
  }
  function bucket(obj, shape){
    /* 把旧的「平铺对象」搬进 {c1: 旧值}；已经是按 cid 的 map 就原样收 */
    var out = {};
    if (obj && typeof obj === 'object' && obj.records && typeof obj.records === 'object') out[dft] = obj;
    else if (obj && typeof obj === 'object') {
      Object.keys(obj).forEach(function(k){ if (obj[k] && typeof obj[k] === 'object') out[k] = obj[k]; });
    }
    if (!out[dft]) out[dft] = shape;
    return out;
  }
  /* 红包：{records,pending} → {c1:{records,pending}} */
  s.rp = bucket(raw ? raw.rp : null, { records: [], pending: [] });
  Object.keys(s.rp).forEach(function(k){ s.rp[k] = normRpBucket(s.rp[k]); });

  /* 礼物流水：每条补 cid */
  var gifts = Array.isArray(raw ? raw.gifts : null) ? raw.gifts : [];
  s.gifts = normGiftsArr(gifts.map(function(g){
    g = g && typeof g === 'object' ? g : {};
    if (!g.cid) g.cid = dft;
    return g;
  }));

  /* 打卡：{mine,tas,taPlaces,history} → {c1:{...}} */
  var rawLocs = raw ? raw.locs : null;
  if (rawLocs && typeof rawLocs === 'object' && (rawLocs.history || rawLocs.mine !== undefined) && !rawLocs.history_c1) {
    var hasCidKeys = Object.keys(rawLocs).some(function(k){ return k.indexOf('c') === 0 && Array.isArray(rawLocs[k] && rawLocs[k].history); });
    s.locs = hasCidKeys ? rawLocs : (function(){ var o = {}; o[dft] = rawLocs; return o; })();
  } else {
    s.locs = {};
  }
  Object.keys(s.locs).forEach(function(k){
    s.locs[k] = {
      mine: normLocCard(s.locs[k] && s.locs[k].mine),
      tas: normLocCard(s.locs[k] && s.locs[k].tas),
      taPlaces: normLocPlaces(s.locs[k] && s.locs[k].taPlaces),
      history: normLocRecords(s.locs[k] && s.locs[k].history)
    };
  });

  /* 朋友圈：{roster,state,seed} → {c1:{...}} */
  var rawMo = raw ? raw.moment : null;
  if (rawMo && typeof rawMo === 'object' && Array.isArray(rawMo.roster)) {
    var moHasCid = Object.keys(rawMo).some(function(k){ return rawMo[k] && typeof rawMo[k] === 'object' && Array.isArray(rawMo[k].roster); });
    if (!moHasCid) { var o2 = {}; o2[dft] = rawMo; s.moment = o2; } else s.moment = rawMo;
  } else s.moment = {};
  Object.keys(s.moment).forEach(function(k){ s.moment[k] = normMoment(s.moment[k]); });

  /* 钱包：ta 是数字 → {c1: 数字} */
  var w = (raw && raw.wallet && typeof raw.wallet === 'object') ? raw.wallet : {};
  var me = Number(w.me);
  s.wallet = { me: isFinite(me) ? Math.max(0, Math.round(me * 100) / 100) : 1314, ta: {} };
  if (typeof w.ta === 'number' && isFinite(w.ta)) s.wallet.ta[dft] = Math.max(0, Math.round(w.ta * 100) / 100);
  else if (w.ta && typeof w.ta === 'object') {
    Object.keys(w.ta).forEach(function(k){
      var v = Number(w.ta[k]);
      if (isFinite(v)) s.wallet.ta[k] = Math.max(0, Math.round(v * 100) / 100);
    });
  }
  if (!Object.keys(s.wallet.ta).length) s.wallet.ta[dft] = 520;

  /* 角标 seenAt → 按 cid；旧档只有一份时间戳，归默认联系人，其他人从「现在」起算 */
  var now = Date.now();
  s.seen = {};
  var self = this;
  ['lettersSeenAt', 'diarySeenAt', 'checkinSeenAt', 'rpSeenAt', 'giftSeenAt'].forEach(function(f){
    var kind = { lettersSeenAt: 'letter', diarySeenAt: 'diary', checkinSeenAt: 'checkin', rpSeenAt: 'rp', giftSeenAt: 'gift' }[f];
    var v = Number(raw ? raw[f] : 0);
    var o = {};
    if (isFinite(v) && v > 0) o[dft] = v;
    s.seen[kind] = o;
  });
  if (raw && raw.seen && typeof raw.seen === 'object') {
    Object.keys(raw.seen).forEach(function(kind){
      if (!raw.seen[kind] || typeof raw.seen[kind] !== 'object') return;
      if (!s.seen[kind] || typeof s.seen[kind] !== 'object') s.seen[kind] = {};
      Object.keys(raw.seen[kind]).forEach(function(k){
        var v = Number(raw.seen[kind][k]);
        if (isFinite(v) && v > 0) s.seen[kind][k] = v;
      });
    });
  }

  /* 日记：d.ta → d.taBy[cid]（TA 视角按联系人拆）。
     normDiary 已把旧 d.ta 收进 taBy.__legacy，这里统一改名成默认联系人 */
  Object.keys(s.diary).forEach(function(k){
    var d = s.diary[k];
    if (!d || typeof d !== 'object') return;
    if (d.taBy && d.taBy.__legacy) {
      d.taBy[dft] = d.taBy.__legacy;
      delete d.taBy.__legacy;
    }
    if (!d.taBy || typeof d.taBy !== 'object') d.taBy = {};
  });

  /* 调度台账：旧档 autoLog 的键没有 cid，全部归默认联系人 */
  var oldLog = (raw && raw.autoLog && typeof raw.autoLog === 'object') ? raw.autoLog : {};
  var newLog = {};
  Object.keys(oldLog).forEach(function(k){
    var v = oldLog[k];
    if (!v || typeof v !== 'object') return;
    newLog[k.indexOf(':') >= 0 ? k : k + ':' + dft] = { d: v.d, n: v.n };
  });
  s.autoLog = newLog;

  /* 调度 nextAt：S.sched['kind:cid'] = 时间戳 */
  var oldSched = (raw && raw.sched && typeof raw.sched === 'object') ? raw.sched : {};
  s.sched = {};
  Object.keys(oldSched).forEach(function(k){
    var v = Number(oldSched[k]);
    if (isFinite(v)) s.sched[k] = v;
  });

  /* 群聊：成员必须对着**正在归一化的这份 contacts** 校验（不能走全局 contactById，
     此刻全局 S 还没被赋值 → 刷新即崩）。s.contacts 在 normS 里已经先于这里建好了。 */
  var validIds = (s.contacts || []).map(function(c){ return c.id; });
  s.groups = normGroups(raw ? raw.groups : null, validIds);
  return s;
}

/* ---------- 5. 卡池隔离（第2单附加规范 §3 / 第22单 B.8） ---------- */

/* 私聊：公共可见 ∪ 该 cid 专属可见。
   ⚠️ 旧版 drawCard() 不传 scope 时把**所有**梦角的专属卡混进池子 —— 那是串卡 bug。
   群聊：传「实际发言成员的 cid」，绝不能拿群 id 去查专属范围。 */
function drawCardFor(cid){
  var spk = contactById(cid) ? cid : (S.contacts[0] ? S.contacts[0].id : 'c1');
  var pool = libVisibleItems('public').concat(libVisibleItems(spk));
  if (!pool.length) return null;
  return pick(pool);
}
function drawCard(scope){
  /* 兼容旧调用点：没有传 cid 时退化为「纯公共池」（绝不串别人的专属卡） */
  if (scope) return drawCardFor(scope);
  var pool = libVisibleItems('public');
  if (!pool.length) return null;
  return pick(pool);
}

function ctDelAsk(cid){

  openSheet('删除「' + c.name + '」？',

    + 'TA 日记、碎影、朋友圈、专属字卡与主动行为计划。<br>公共字卡、我的日记、全局设置和其他梦角**不受影响**。</div>',
    [{ label: '取消', act: 'sheet-close' }, { label: '确认删除', kind: 'danger', act: 'ct-del-do', id: c.id }]);
}
function ctDelDo(cid){
  var c = contactById(cid);
  if (!c) return;
  if (S.contacts.length <= 1) { toast('至少要保留一位私聊梦角'); return; }
  var k = c.id;
  /* 会话 / 未读 / 已读回执 */
  delete S.msgs[k];
  delete S.unread[k];
  /* 信件 / 通话 / 碎影 / 红包 / 礼物 / 打卡 / 朋友圈 / TA 日记 / 专属字卡 / 调度 */
  S.lets = (S.lets || []).filter(function(l){ return l.cid !== k; });
  S.calls = (S.calls || []).filter(function(x){ return x.cid !== k; });
  S.shadows = (S.shadows || []).filter(function(x){ return x.cid !== k; });
  delete S.rp[k];
  S.gifts = (S.gifts || []).filter(function(g){ return g.cid !== k; });
  delete S.locs[k];
  delete S.moment[k];
  /* TA 的头像也是按 cid 存的，人走了头像别留在存档里 */
  if (S.avatars && S.avatars.taBy) delete S.avatars.taBy[k];
  ['letter', 'diary', 'checkin', 'rp', 'gift'].forEach(function(kind){
    if (S.seen && S.seen[kind]) delete S.seen[kind][k];
  });
  Object.keys(S.diary).forEach(function(dk){
    var d = S.diary[dk];
    if (d && d.taBy) delete d.taBy[k];
  });
  S.cardLib.groups = (S.cardLib.groups || []).filter(function(g){ return g.scope !== k; });
  Object.keys(S.sched).forEach(function(sk){ if (sk.indexOf(':' + k) === sk.length - k.length - 1) delete S.sched[sk]; });
  Object.keys(S.autoLog).forEach(function(ak){ if (ak.indexOf(':' + k) === ak.length - k.length - 1) delete S.autoLog[ak]; });
  /* 群聊里把 TA 移出去 */
  (S.groups || []).forEach(function(g){ g.members = g.members.filter(function(m){ return m !== k; }); });
  S.contacts = S.contacts.filter(function(x){ return x.id !== k; });
  /* 正聊着 TA / 进行中的通话指向 TA：安全回落 */
  if (S.cid === k) S.cid = S.contacts[0].id;
  if (RT.call && RT.call.cid === k) { RT.call = null; S.callLive = null; callShow(false); callMiniShow(false); }
  if (RT.shadowCid === k) RT.shadowCid = '';
  if (RT.callLogCid === k) RT.callLogCid = '';
  if (RT.ltCid === k) RT.ltCid = '';
  if (RT.diaryCid === k) RT.diaryCid = S.cid;
  if (RT.momentCid === k) RT.momentCid = S.cid;
  saveNow(); closeSheet(); paintContacts(); paintHome();
  if (RT.route === 'chat' || RT.route === 'chatlist') go('chatlist', true);
  toast('已删除 ' + c.name);
}

function grpSaveDo(gid){
  var nm = $('grpName');
  var name = String((nm && nm.value) || '').trim().slice(0, 20);
  if (!name) { toast('先给群起个名字'); return; }
  if (!RT.grpSel.length) { toast('至少选一位成员'); return; }
  closeSheet();
  if (gid) {
    var g = groupById(gid);
    if (!g) { toast('这个群已经不在了'); return; }
    /* 第2单附加规范 §2.4：群改名/增删成员不碰任何字卡专属范围 */
    g.name = name; g.members = RT.grpSel.slice();
    saveNow(); paintContacts(); paintHome();
    if (RT.route === 'chat' && S.cid === gid) paint();
    toast('群聊已更新');
    return;
  }
  var ng = normGroupChat({ id: uid('grp'), name: name, members: RT.grpSel });
  S.groups.push(ng);
  S.msgs[ng.id] = [];
  saveNow(); paintContacts(); paintHome();
  toast('「' + name + '」已创建');
}
function grpDelDo(gid){
  var g = groupById(gid);
  if (!g) return;
  S.groups = S.groups.filter(function(x){ return x.id !== gid; });
  delete S.msgs[gid];
  delete S.unread[gid];
  if (S.cid === gid) S.cid = S.contacts[0].id;
  saveNow(); closeSheet(); paintContacts(); paintHome();
  if (RT.route === 'chat' || RT.route === 'chatlist') go('chatlist', true);
  toast('群聊已解散');
}

/* ============================================================================
   src/base/state.js · 存档与状态树（B1 共用基础）
   ----------------------------------------------------------------------------
   来源：客单19 `_src/10_core.js` 的 defS(L400-471) / defSet(L162-399) / normS(L921-1061)
        （L 为 10_core.js 行号，指纹 3E51DE7D2CDD…）；旧档迁移 port 自
        `_src/43_contacts.js` 的 migrateMultiContact(L188-311)。
   原客单只读，本文件是**重新落笔的等价实现 + 三处阻塞修复**，不是逐字节拷贝。
   保留的行为见 PROGRESS.md §6.2；未 port 的部分见 recipes/base.md「未 port 清单」。

   本层解决的阻塞项 #3：存档写入失败必须可见（19 原状是 try{}catch(e){} 静默吞）。
   ============================================================================ */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;

})(typeof globalThis !== 'undefined' ? globalThis : this, function () {

  /* ---- 未迁移功能的状态形状：由功能层注册，本层只保证「缺了就安全回落」 ----
     19 的 normS 直接调 normStkLib/musNormMusic/normQzAll/… 共 18 个外部归一化函数，
     不打桩则加载即崩（会话B 实测）。这里改成**注册表**：没注册就回落安全形状。 */
  var SAFE_SHAPES = {
    stkLib: function () { return { groups: [] }; },
    music: function () { return { songs: [], hist: [], mode: 'list' }; },
    qz: function () { return { surveys: [], runs: [], submitted: [] }; },
    coScenes: function () { return []; },
    giftLib: function () { return []; },
    /* 未注册时的安全回落：只做「是数组且元素是对象」的粗过滤。
       注册了功能层的 norm* 之后，才做逐字段重建（例如信件的 normLetters）。 */
    lets: function (v) { return Array.isArray(v) ? v.filter(function (x) { return x && typeof x === 'object'; }) : []; },
    shadows: function (v) { return Array.isArray(v) ? v.filter(function (x) { return x && typeof x === 'object'; }).slice(0, 300) : []; }
  };
  var NORMS = {};           /* 形状归一化注册表：name -> function(value) */
  function registerNorm(name, fn) { if (typeof fn === 'function') NORMS[name] = fn; }
  function normOf(name, value) {
    if (typeof NORMS[name] === 'function') {
      try { return NORMS[name](value); } catch (e) { /* 单个归一化坏了不拖垮整树 */ }
    }
    return (SAFE_SHAPES[name] || function () { return null; })(value);
  }

  /* ============================ 工具 ============================ */
  /* 唯一 ID 工厂。⚠️ **必须**显式传入 now/random：
     本模块不允许存在第二处时钟/随机源 —— 否则测试注入假时钟后生成结果仍不可重复（断言 m）。 */
  function uidFactory(now, random) {
    if (typeof now !== 'function' || typeof random !== 'function') {
      throw new Error('uidFactory(now, random) 需要显式注入时钟与随机源');
    }
    var n = 0;
    return function (p) {
      n++;
      return (p || 'x') + now().toString(36) + n.toString(36) + Math.floor(random() * 1679616).toString(36);
    };
  }
  function needId(id, where) {
    if (typeof id !== 'function') throw new Error(where + ' 需要显式 id 生成器（由 createState 的 ctx 提供）');
    return id;
  }

  function str(x, d) { return typeof x === 'string' ? x : d; }
  function num(x, d) { var v = Number(x); return isFinite(v) ? v : d; }

  /* ============================ 默认设置 ============================ */
  /* 只 port B1/B2 用得到、且属「共用基础」的设置；功能专有设置项由各功能层注册。
     ⚠️ 宿主可以注入**更完整的设置形状**（opts.settingsShape）—— 接入客单19 时
     必须传它的 defSet()，否则旧存档里未迁移功能的设置项会在归一化时被丢掉。 */
  function defSet() {
    return {
      replyMin: 2, replyMax: 6,
      readNoP: 12,
      cardReplyP: 60,
      stkProb: 20,
      pokeOn: true,
      pokeBack: 40, pokeMsgProb: 20, pokeReplyProb: 20,
      quoteProb: 30,
      autoMsgOn: true, autoMsgMin: 20, autoMsgMax: 60,
      notifyOn: true, notifyBgOn: false
    };
  }
  /* 数值设置的安全域（port 自 19 的 normS L1004-1015 同类规则） */
  var RANGES = {
    readNoP: [0, 100], cardReplyP: [0, 100], stkProb: [0, 100],
    pokeBack: [0, 100], pokeMsgProb: [0, 100], pokeReplyProb: [0, 100], quoteProb: [0, 100]
  };
  var PAIRS = [['replyMin', 'replyMax'], ['autoMsgMin', 'autoMsgMax']];   /* 写反自动对调 */

  /* ============================ 默认联系人/消息形状 ============================ */

  var MOOD_DEFAULT = ['开心', '平静', '想你', '有点累'];

  function normContact(c, i) {
    c = isObj(c) ? c : {};
    return {
      id: str(c.id, '') || ('c' + ((i || 0) + 1)),
      name: str(c.name, '梦角').slice(0, 12),
      av: str(c.av, '').slice(0, 400000),
      c: str(c.c, '#B78C85'),
      role: str(c.role, '梦角'),
      on: c.on !== false,
      talk: Array.isArray(c.talk) ? c.talk.filter(function (x) { return typeof x === 'string'; }) : [],
      post: Array.isArray(c.post) ? c.post : [],
      letter: Array.isArray(c.letter) ? c.letter : []
    };
  }

  var MSG_TYPES = ['text', 'card', 'stk', 'sticker', 'stkimg', 'image', 'voice', 'redpk', 'gift', 'call', 'shadow', 'sys', 'song'];
  function normMsg(m, id, now) {
    var gen = needId(id, 'normMsg');
    var _now = needNow({ now: now }, 'normMsg');
    m = isObj(m) ? m : {};
    var t = m.type;

     只在开机应用一次的话，进一次聊天再回来壁纸就没了（静默失效，屏幕上什么都不报）。 */

/* 屏清单：本单真接的五屏 + 第5单信箱三屏（列表 / 写信 / 读信）+ 第13单纪念日一屏，

      14_anniv.js 里读的 `RT.route === 'anniv'` **必须逐字一致** —— 错一个字就静默落进 soon。 */
function screenOf(view, arg) {
  if (view === 'chat') return chatScreenHTML();
  if (view === 'cards') return cardsScreenHTML();
  if (view === 'settings') return settingsScreenHTML();
  if (view === 'letter') return letterScreenHTML();
  if (view === 'letter-write') return letterWriteHTML();
  if (view === 'letter-one') return letterOneScreenHTML();
  if (view === 'anniv') return annivScreenHTML();
  if (view === 'soon') return soonScreenHTML(arg);
  return soonScreenHTML(view);
}
var ROUTE_OF = {
  chat: 'chat', cards: 'cards', settings: 'settings', soon: 'soon',
  letter: 'letter', 'letter-write': 'letter-write', 'letter-one': 'letter-one',
  anniv: 'anniv'
};

function afterRender() {
  if (RT.route === 'chat') {

    var stkBtn = $('panelBtnStk');
    if (stkBtn && stkBtn.parentNode) stkBtn.parentNode.removeChild(stkBtn);
    bindQuoteUI();               /* 第1单第16条：气泡菜单 / 引用块跳回 / 取消引用 */
    paintThread();               /* 内部的 injectQuoteBlocks() 会把引用块补进气泡 */

    paintSettings();

       全部来信清零，那样「未读信高亮描边」（工单第1条）在列表上永远看不到。
       本单改成：进列表保留未读描边，**读完某一封**才清那一封（冻结片 paintLetterOne 本来就逐封清，
       它自己的文案也写着「读完这封信，未读标记就消掉了」）；离开信箱时才整体标记已读（见 letterLeaveSeen）。

    /* 第13单 纪念日。片自己的 paintAnniv 只画「今日卡 + 列表 + 庆祝文案」；

       片自己会调 bindAnnivSearch()（搜索框是片渲染的、也由片绑），这里不重复绑。 */
    paintAnniv();

  applyWalls();

/* 冻结片 43_contacts 里点几下会用到的旧路由（单梦角形态下不会触发，但必须存在且不撒谎）；
   ★ 第5单信箱：33_letter.js 里调 `go('letter')` / `go('letter-write')` / `go('letter-one')`
     走的就是这里 —— 少了这三个映射，写完信点寄出会回到**主屏**、点开信会弹占位屏（静默错屏不报错）。 */
function mapRoute(r) {
  r = String(r || '');
  if (r === 'chat' || r === 'chatlist') return 'chat';
  if (r === 'cards') return 'cards';
  if (r === 'home') return 'home';
  if (r === 'letter' || r === 'letter-write' || r === 'letter-one') return r;
  /* 第13单 纪念日：片里**不调 go()**（它没有导航栈依赖），这一条是给外壳/夹具的
     「回到纪念日」留的；片里 deliverAnnivGreet / annivSayToday 按 `RT.route === 'anniv'` 决定要不要重画当屏。 */
  if (r === 'anniv') return 'anniv';
  return 'soon';
}

  var v = mapRoute(route);

  openView(v, ROUTE_OF[v] === 'soon' ? route : undefined);
}

}
function qCopyTextOf(m) {
  var t = (m && m.type) || 'text';

/* 引用快照 → 展示文本（兼容字符串与对象两种形态：本单落档是字符串） */
function qDisp(q) {
  if (q == null) return '';

/* ---------- 13.2 反向：TA 按概率引用我 ---------- */
/* 取材池（工单表第16条 + 客单18 第121单）：**最近 8 条 ∩ 30 分钟内 ∩ 我发的 ∩ 可引用** */
function qPool(cid) {
  var list = S.msgs[cid] || [], out = [], now = Date.now();
  var from = Math.max(0, list.length - Q_POOL_N);
  for (var i = from; i < list.length; i++) {
    var m = list[i];
    if (!m || m.from !== 'me') continue;
    if (!qQuotable(m)) continue;
    if (!m.ts || (now - m.ts) > Q_POOL_MS) continue;
    out.push(m);
  }
  return out;
}
/* 给 TA 将要发出的那条 payload 挂引用（没抽到就原样返回）。
   挂的是**三件套**：quote（文本快照）/ qid（跳回用）/ qside（归属）。 */
function qAttachTaQuote(payload, cid) {
  try {
    if (!payload || payload.quote) return payload;
    var p = Number(S.settings && S.settings.quoteProb);
    if (!isFinite(p)) p = 30;
    if (!(p > 0)) return payload;                                  /* 0 = 关闭 */
    if (Math.random() * 100 >= p) return payload;                  /* 每次回复最多引一条 */
    var pool = qPool(cid || S.cid);
    if (!pool.length) return payload;
    var cand = pool.filter(function (m) { return m.id !== RT.lastQid; });  /* 不重复引同一句 */
    if (!cand.length) cand = pool;                                 /* 池里只有那一条时允许复用 */
    var hit = cand[cand.length - 1 - Math.floor(Math.random() * cand.length)];
    if (!hit) return payload;
    payload.quote = qLabelOf(hit);
    payload.qid = hit.id;
    payload.qside = 'self';                                        /* 池里只有我发的 */
    RT.lastQid = hit.id;
    return payload;
  } catch (e) { return payload; }                                  /* 引用失败绝不影响消息本身 */
}

/* ---------- 13.3 渲染：气泡里的引用块 + 输入条上方的待引用条 ---------- */
function injectQuoteBlocks() {
  var th = $('thread');
  if (!th) return;
  var list = S.msgs[S.cid] || [], byId = {};
  list.forEach(function (m) { if (m) byId[m.id] = m; });
  var rows = th.querySelectorAll('.mrow[data-mid]');
  Array.prototype.forEach.call(rows, function (row) {
    var bub = row.querySelector('.bubble');

    var old = bub.querySelector('.q-blk');

    if (old) return;                                   /* 已经在位就不重复插 */
    var el = document.createElement('span');
    el.className = 'q-blk';
    if (m.qid) {
      el.setAttribute('data-act', 'q-jump');

/* 待引用条：位置在面板与输入条之间（工单表第16条：输入条上方） */

/* ---------- 13.4 气泡操作菜单（复制 / 引用） ---------- */
function qMenuClose() {
  if (Q_MENU && Q_MENU.parentNode) Q_MENU.parentNode.removeChild(Q_MENU);
  Q_MENU = null;
}
function qMenuToggle(bub, m) {
  var same = !!(Q_MENU && Q_MENU.getAttribute('data-for') === m.id);
  qMenuClose();
  if (same) return;                                   /* 再点同一条 = 收起 */
  var ph = document.querySelector('.phone');
  if (!ph) return;
  var menu = document.createElement('div');
  menu.className = 'q-menu';
  menu.setAttribute('data-for', m.id);
  var html = '';
  if (qCopyable(m)) html += '<button data-act="msg-copy" data-id="' + esc(m.id) + '">' + qSvg(Q_ICO_COPY) + '复制</button>';
  html += '<button data-act="msg-quote" data-id="' + esc(m.id) + '">' + ico('quote') + '引用</button>';
  menu.innerHTML = html;
  ph.appendChild(menu);
  Q_MENU = menu;
  Q_OPEN_AT = Date.now();
  /* 定位用**框内坐标**：.phone 是 relative 且带 overflow:hidden，菜单挂在它里面就跟着框一起缩放；
     把视口坐标除以当前缩放比 s 换算回框内坐标（s = 框实测宽 / 390）。 */
  var pr = ph.getBoundingClientRect(), br = bub.getBoundingClientRect();
  var s = (pr.width / 390) || 1;
  var mw = menu.offsetWidth, mh = menu.offsetHeight;
  var bx = (br.left - pr.left) / s, by = (br.top - pr.top) / s, bb = (br.bottom - pr.top) / s;
  var top = by - mh - 6;                              /* 优先气泡上方 */
  if (top < 4) top = Math.min(bb + 6, 844 - mh - 4);  /* 放不下落下方，且夹在框内 */
  menu.style.top = Math.round(top) + 'px';
  menu.style.left = Math.round(Math.min(Math.max(4, bx), 390 - mw - 4)) + 'px';
}
function bindQuoteUI() {
  var th = $('thread');
  if (!th) return;
  if (th.getAttribute('data-qbound') !== '1') {
    th.setAttribute('data-qbound', '1');
    th.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      if (t.closest('.q-blk')) return;                 /* 引用块自己负责跳转，不弹菜单 */
      var bub = t.closest('.bubble');
      if (!bub) return;
      if (bub.getAttribute('data-act')) return;        /* 卡片自己的动作（碎影/红包/礼物）优先 */
      var row = bub.closest('.mrow');
      var m = row ? qFind(row.getAttribute('data-mid')) : null;
      if (!qEligible(m)) return;                       /* 系统条 / 卡片不弹 */
      qMenuToggle(bub, m);
    });
    th.addEventListener('scroll', function () {
      /* ⚠️ 实测踩过：把远处的消息滚进视口（或惯性滚动 settle）会派发 scroll，而 scroll 事件是
         **异步**到达的 —— 它可能正好落在「刚点开菜单」之后，于是菜单刚弹出来就被自己收掉
         （表现：同一条气泡点第一次能弹、点第二次不弹，纯看谁先到）。
         刚弹出 400ms 内的 scroll 一律忽略：那是「把这条滚过来」造成的，不是用户在滚。 */
      if (Date.now() - Q_OPEN_AT < 400) return;
      qMenuClose();
    });
  }
  if (!document.body.getAttribute('data-qdoc')) {
    document.body.setAttribute('data-qdoc', '1');
    /* 点菜单外收起：capture 阶段先跑，命中菜单或气泡就交给上面的处理器决定 */
    document.addEventListener('click', function (e) {
      if (!Q_MENU) return;
      var t = e.target;
      if (t && t.closest && (t.closest('.q-menu') || t.closest('.bubble'))) return;
      qMenuClose();
    }, true);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') qMenuClose(); });
  }
}

/* ---------- 13.5 复制 / 引用 / 跳回 ---------- */
function qCopyMsg(id) {

    var ok = false;

  }

}

/* ---------- 13.6 三处赋值包装（接缝纪律 ①②③） ---------- */
/* ③ 归一化接缝 —— **这一处是实测踩出来的**：

normMsg = function (m) {

var FROZEN_PAINT_THREAD = paintThread;
paintThread = function () {

     冻结片 `lib/25_chat.js:173` 的滚底（`th.scrollTop = th.scrollHeight`）发生在

     补这一下与冻结片原意完全一致（它就是「每次重画都滚到底」），只是把顺序补正 ⇒ 行为不变、结果变对。 */

/* ---------- 13.1 状态：补种 + 归零 ----------
   ⚠️ 顺序是**先看内存、再看存档 raw**：base 的 load 在归一化时已经把这五个键丢掉了，
      只按内存补会把用户存的东西种成空数组（症状「加完纪念日刷新一下全没了」，29 实测过一次）。
   本函数由 bridge.js 的 `load` 包装在**每次 load 之后**调用 —— 开机、将来的 resetAll、
   以及任何「导入全量备份」式的重建都走同一条路，键不会再被抹掉。 */
function seedAnnivKeys() {
  if (!S) return false;
  var raw = null;
  try {
    var st = (B && B.state && typeof B.state.storage === 'function') ? B.state.storage() : null;
    var key = (B && B.state && B.state.KEY) || 'co30.state.v1';
    raw = JSON.parse((st && st.getItem(key)) || 'null');
  } catch (e) { raw = null; }
  ['anniv', 'annivLines', 'annivGreeted', 'annivShow', 'annivBg', 'polaroidBg'].forEach(function (k) {
    if (S[k] === undefined && raw && raw[k] !== undefined) S[k] = raw[k];
  });
  S.anniv = normAnniv(S.anniv);
  S.annivLines = normAnnivLines(S.annivLines);
  if (typeof S.annivGreeted !== 'string') S.annivGreeted = '';
  S.annivShow = normAnnivShow(S.annivShow, S.anniv);
  if (typeof S.annivBg !== 'string') S.annivBg = '';
  /* 同族：主屏拍立得的相片位（2026-10-17 加的，理由与上面五个键完全一样 ——
     base 的逐键白名单重建也会把它丢掉。键名挂在同一个补种函数里，桥的接线一个字不用改。 */
  if (typeof S.polaroidBg !== 'string') S.polaroidBg = '';
  return true;
}
/* 「卡片显示哪一条」的归一化：空 / 找不到的 id 一律回**自动**（''）。
   这样脏存档、删过的条目都不会把卡片指成一条不存在的（29 §4.9.3-A）。 */
function normAnnivShow(v, list) {
  var id = String(v == null ? '' : v).trim();
  if (!id) return '';
  var arr = Array.isArray(list) ? list : [];
  for (var i = 0; i < arr.length; i++) if (arr[i] && arr[i].id === id) return id;
  return '';
}
/* 卡片显示哪一条的**优先序**（29 §4.9.3-B 原样）：
   手选那条 → 今天有纪念日 → 第一条「一起多少天」 → 第一条 → 都没有则 null。 */
function annivBoardPick() {
  var list = S.anniv || [];
  if (!list.length) return null;
  var shown = normAnnivShow(S.annivShow, list);
  if (shown) { var a = findAnniv(shown); if (a) return a; }
  var today = annivTodayKeys();
  if (today.length) return today[0];
  for (var i = 0; i < list.length; i++) if (list[i].type === 'together') return list[i];
  return list[0];
}

/* ---------- 13.4 主屏大卡的背景图（灰区） ----------
   客单23 的相片槽是 `S.photos['p2:anniv']`（照片板下挂）；本单没有照片板 ⇒ 落成顶层键
   `S.annivBg`（字符串 dataURL，'' = 用版式稿自带的渐变底）。
   灰区点击：**没有**背景 → 直接开文件选择（用户要的就是这一下）；
             **已有**背景 → 给「换一张 / 恢复默认」两条路（不然传错了没法回头，那是死路）。 */
var ANNIV_BG_MAX = 1440;      /* 长边上限：够大卡用，又不至于把 localStorage 撑爆 */
function annivBgAction() {
  if (String(S.annivBg || '')) { annivBgSheet(); return; }

}
function annivBgPick() {
  var f = $('annivBgFile');

function annivBgSheet() {

    [{ label: '恢复默认', act: 'anniv-bg-clear' }, { label: '换一张', kind: 'dark', act: 'anniv-bg-pick' }]);
}
function annivBgClear() {

  saveNow();
  closeSheet();
  paintHome();
  toast('背景回到默认');
}
/* 读图 → 等比缩到长边 ≤1440 → JPEG 0.82 → dataURL。全程本地：不外传、不往产物里塞 base64
   （产物的「零 base64」不变式说的是**打包资产**；这是用户自己选的图，存在他自己的存档里）。 */
function annivBgSet(file) {
  if (!file) return false;
  if (!/^image\//.test(String(file.type || ''))) { toast('选一张图片文件（jpg / png / webp）'); return false; }
  var fr = new FileReader();
  fr.onerror = function () { toast('这张图读不出来，换一张试试'); };
  fr.onload = function () {
    var img = new Image();
    img.onerror = function () { toast('这张图打不开，换一张试试'); };
    img.onload = function () {
      try {
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) { toast('这张图尺寸读不出来，换一张试试'); return; }
        var sc = Math.min(1, ANNIV_BG_MAX / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * sc)), chh = Math.max(1, Math.round(h * sc));
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = chh;
        var cx = cv.getContext('2d');
        if (!cx) { toast('这个浏览器画不了布，换一张试试'); return; }
        cx.drawImage(img, 0, 0, cw, chh);
        var url = cv.toDataURL('image/jpeg', 0.82);
        if (!url || url.length < 64) { toast('这张图没转出来，换一张试试'); return; }
        S.annivBg = url;
        var ok = saveNow();
        paintHome();
        toast(ok ? '背景换好了' : '背景换好了，但没能写进存档（存储可能满了）');
      } catch (e) {
        toast('这张图处理不了，换一张试试');
      }
    };
    img.src = String(fr.result || '');
  };
  fr.readAsDataURL(file);
  return true;
}

/* ---------- 13.4c 图片层的第三个槽位：让 `polaroidBg` 也进 IndexedDB（硬规则20） ----------
   ⚠️ 必须覆盖这三个函数，不能只加一个状态键：
     它们住在**冻结片** `lib/06_media.js` 里，槽位是**白名单**（wall 组只有 home / chat / anniv），
     新图槽不被认的后果有两条，都很严重：
       · `mediaCollect` 不收 ⇒ `idbBoot` / `mediaSaveToIdb` 都不会把它写进 IDB；
       · `mediaStrippedCopy` 不摘 ⇒ 它会**留在 localStorage 的存档里**，直接违反硬规则20
         （L105 的机检是「扫所有 key，`data:image` 次数为 0」）。
   片一个字节不能改（S1 指纹），所以在本层**按名覆盖**：片里那三个是顶层函数声明
   （与 bridge.js 覆盖 16 个名字同一手法，同一作用域内赋值即覆盖，调用方按名解析拿到的是新值）。
   只多带一个 `polaroid` 键：**四组键名与形状一字不变**（wall / me / contacts / emoji）。 */
/* ⚠️ 三条 `var` 分开写：S14 的声明识别只认逗号声明里的**第一个**，
   写成 `var a = x, b = y, c = z;` 时后两个会被误判成「世界里不存在的名字」（工具口径，不是产品问题）。 */
var _frozenMediaCollect = mediaCollect;
var _frozenMediaApply = mediaApply;
var _frozenMediaStrip = mediaStrippedCopy;
mediaCollect = function () {
  var m = _frozenMediaCollect();
  if (m && m.wall) m.wall.polaroid = String(S.polaroidBg || '');
  return m;
};
mediaApply = function (m) {
  var n = _frozenMediaApply(m);
  if (m && m.wall && typeof m.wall.polaroid === 'string' && m.wall.polaroid) { S.polaroidBg = m.wall.polaroid; n++; }
  return n;
};
mediaStrippedCopy = function () {
  var out = _frozenMediaStrip();
  if (out) out.polaroidBg = '';        /* 摘出去（图已进 IDB），内存里的 S 不变 */
  return out;
};

/* ---------- 13.5 TA 当天庆祝：注册进 base 的唯一调度中心 ----------
   ⚠️ 片里**没有 registerTask**（只声明了 deliverAnnivGreet）——不注册的话 TA 永远不会在
      纪念日当天来庆祝，而且一句报错都没有。
   ⚠️「每天 ≤1」由片里 run() 内部的当日门（S.annivGreeted）保证，**不能靠调度器的 cap**：
      调度器无论 run() 返回什么都会把 nextAt 往后推，「今天没有纪念日」的空触发会白吃一次配额
      （工单第13单踩坑第 1 条，客单17 实测）。所以这里 on() 只做「有没有纪念日」这一道粗门。
   cd：客单17 的 every:[45,120] 分钟，照搬。 */
var annivAuto = {
  id: 'anniv',
  on: function () { return (S.anniv || []).length > 0; },
  cd: function () { return rnd(45, 120) * 60000; },
  run: function () { return deliverAnnivGreet(); }
};

/* 片内部会调 paintAnniv()（保存 / 删除 / 一键说 / 当天庆祝之后）——
   那些路径也必须跟上联动条与小标，所以在**这里包一层**（赋值包装，原函数显式存下来；
   ⚠️ 不能用重声明：那是冻结片已有的顶层函数，S5/S6 两道闸门会拦）。
   本单第16条的 paintThread 包装就是这个路数。 */
var FROZEN_PAINT_ANNIV = paintAnniv;
paintAnniv = function () {
  FROZEN_PAINT_ANNIV();
  annivLinkage();
};

  acts: function () { return Object.keys(ACTS); },
  actsUnwired: function () { return ACTS_UNWIRED.slice(); },
  stubLog: function () { return (typeof STUB_LOG !== 'undefined') ? STUB_LOG.slice() : []; },
  seedKey: SEED_KEY,
  /* 第15单 · 设置中心（名字 / 头像 / 壁纸）的验收把手。
     读的那几个只回**状态真值**（判定不许靠 DOM 反推）；写的那几个是**真动作的入口**
     （与设置页上那颗按钮走同一条函数），夹具不许绕过 UI 直接改 S —— 否则「接线断了」测不出来。 */
  myName: function () { return String(S.myName || ''); },
  taName: function () { return String(ta().name || ''); },
  avatarsRaw: function () {
    return { me: String(S.avatars.me || ''), taBy: JSON.parse(JSON.stringify(S.avatars.taBy || {})) };
  },
  wallsRaw: function () { return { home: String(S.walls.home || ''), chat: String(S.walls.chat || '') }; },
  taAvatar: function (cid) { return String(taAv(cid || S.cid) || ''); },
  setName: setProfileName,
  upload: profileUpload,
  /* 聊天记录单独清除（2026-10-17）：判据要**分开量**这五项，才能证明「清干净且没清多」
     —— 只量 msgs 为空是看不出「未读角标还挂着 / TA 还在按计划回复 / 打字气泡一直转」的。 */
  clearChatLog: clearChatLog,
  msgTotal: msgTotal,
  unreadTotal: function () {
    var n = 0;
    Object.keys(S.unread || {}).forEach(function (k) { n += (Number(S.unread[k]) || 0); });
    return n;
  },
  pendingReplies: function (cid) { return (B && B.scheduler && B.scheduler.pendingLater) ? B.scheduler.pendingLater(cid || S.cid).length : -1; },
  typingOn: function () { return !!RT.typing; },
  quoteOn: function () { return !!RT.quote; },
  resetAvatar: resetAvatar,
  resetWalls: resetWalls,
  applyWalls: applyWalls,
  cropSquareDataUrl: cropSquareDataUrl,
  scaleToDataUrl: scaleToDataUrl,
  mediaState: function () {
    return { inIdb: !!mediaInIdb, note: String(idbNote || ''), collect: mediaCollect() };
  },
  mediaApply: mediaApply,
  idbBoot: idbBoot,
  wired: function () { return D.wired; }
};
</script>
